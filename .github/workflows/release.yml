name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "stable"
  NODE_VERSION: "20"
  WAILS_VERSION: "v2.12.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: clawfirm-macos-universal
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: clawfirm-linux-amd64
          - os: windows-latest
            platform: windows/amd64
            artifact: clawfirm-windows-amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cmd/desktop/frontend/package-lock.json

      # Linux: install GTK + WebKit build deps (Ubuntu 24.04 uses 4.1)
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend deps
        run: npm ci
        working-directory: cmd/desktop/frontend

      - name: Build frontend
        run: npm run build
        working-directory: cmd/desktop/frontend

      # --- Build the embedded `func` binary ---
      - name: Build func (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rm -f app/assets/func
          mkdir -p bin
          GOOS=darwin GOARCH=arm64 go build -o bin/func-arm64 ./cmd/func
          GOOS=darwin GOARCH=amd64 go build -o bin/func-amd64 ./cmd/func
          lipo -create -output app/assets/func bin/func-arm64 bin/func-amd64
          rm bin/func-arm64 bin/func-amd64

      - name: Build func (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -f app/assets/func
          go build -o app/assets/func ./cmd/func

      - name: Build func (Windows)
        if: runner.os == 'Windows'
        run: |
          Remove-Item -Force app/assets/func -ErrorAction SilentlyContinue
          go build -o app/assets/func.exe ./cmd/func
          Move-Item -Force app/assets/func.exe app/assets/func

      # --- Wails build ---
      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_OUTPUT"

      - name: Build desktop app (Linux)
        if: runner.os == 'Linux'
        run: |
          wails build \
            -tags webkit2_41 \
            -ldflags "-X github.com/ai-gateway/clawfirm/app.Version=${{ steps.version.outputs.version }}" \
            -platform ${{ matrix.platform }} \
            -o clawfirm
        working-directory: cmd/desktop

      - name: Build desktop app
        if: runner.os != 'Linux'
        shell: bash
        run: |
          wails build \
            -ldflags "-X github.com/ai-gateway/clawfirm/app.Version=${{ steps.version.outputs.version }}" \
            -platform ${{ matrix.platform }} \
            -o clawfirm
        working-directory: cmd/desktop

      # --- Build standalone CLI binary ---
      - name: Build CLI (macOS universal)
        if: runner.os == 'macOS'
        run: |
          mkdir -p cli-out
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X github.com/ai-gateway/clawfirm/app.Version=${{ steps.version.outputs.version }}" -o cli-out/clawfirm-arm64 ./cmd/clawfirm
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X github.com/ai-gateway/clawfirm/app.Version=${{ steps.version.outputs.version }}" -o cli-out/clawfirm-amd64 ./cmd/clawfirm
          lipo -create -output cli-out/clawfirm cli-out/clawfirm-arm64 cli-out/clawfirm-amd64
          rm cli-out/clawfirm-arm64 cli-out/clawfirm-amd64

      - name: Build CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p cli-out
          go build -ldflags "-X github.com/ai-gateway/clawfirm/app.Version=${{ steps.version.outputs.version }}" -o cli-out/clawfirm ./cmd/clawfirm

      - name: Build CLI (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p cli-out
          go build -ldflags "-X github.com/ai-gateway/clawfirm/app.Version=${{ steps.version.outputs.version }}" -o cli-out/clawfirm.exe ./cmd/clawfirm

      # --- Package ---
      - name: Package (macOS .app → .zip)
        if: runner.os == 'macOS'
        run: |
          cd cmd/desktop/build/bin
          ditto -c -k --keepParent clawfirm.app clawfirm-macos-universal.zip

      - name: Package CLI (macOS → .tar.gz)
        if: runner.os == 'macOS'
        run: |
          cd cli-out
          tar czf clawfirm-cli-macos-universal.tar.gz clawfirm

      - name: Package (Linux → .tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd cmd/desktop/build/bin
          tar czf clawfirm-linux-amd64.tar.gz clawfirm

      - name: Package CLI (Linux → .tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd cli-out
          tar czf clawfirm-cli-linux-amd64.tar.gz clawfirm

      - name: Package (Windows → .zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd cmd/desktop/build/bin
          mv clawfirm clawfirm.exe
          7z a clawfirm-windows-amd64.zip clawfirm.exe

      - name: Package CLI (Windows → .zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd cli-out
          7z a clawfirm-cli-windows-amd64.zip clawfirm.exe

      # --- Upload artifacts ---
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            cmd/desktop/build/bin/*.zip
            cmd/desktop/build/bin/*.tar.gz

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-cli
          path: |
            cli-out/*.zip
            cli-out/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Move latest tag
        run: |
          git tag -f latest ${{ github.ref_name }}
          git push origin latest --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          body: |
            ## Clawfirm ${{ github.ref_name }}

            Clawfirm - AI Gateway Desktop App & CLI

            ### Downloads

            #### Desktop App (GUI)

            | OS | Package |
            |----|---------|
            | macOS (Apple Silicon + Intel) | `clawfirm-macos-universal.zip` |
            | Windows x64 | `clawfirm-windows-amd64.zip` |
            | Linux x64 | `clawfirm-linux-amd64.tar.gz` |

            #### CLI (command-line only)

            | OS | Package |
            |----|---------|
            | macOS (Apple Silicon + Intel) | `clawfirm-cli-macos-universal.tar.gz` |
            | Windows x64 | `clawfirm-cli-windows-amd64.zip` |
            | Linux x64 | `clawfirm-cli-linux-amd64.tar.gz` |

            ### Installation

            #### Desktop App
            - **macOS**: Unzip, drag to Applications. On first launch: System Settings → Privacy & Security → Allow
            - **Windows**: Unzip and run `clawfirm.exe`. SmartScreen → "More info" → "Run anyway"
            - **Linux**: `tar xzf clawfirm-linux-amd64.tar.gz && ./clawfirm`

            #### CLI
            ```bash
            # macOS / Linux
            tar xzf clawfirm-cli-*.tar.gz
            sudo mv clawfirm /usr/local/bin/

            # Windows: unzip and add clawfirm.exe to your PATH
            ```

            ---

            ### WhipFlow — Running `.whip` Workflows

            Clawfirm includes **WhipFlow**, an AI workflow engine using the OpenProse DSL.
            Use `.whip` files to define multi-step, multi-agent tasks.

            #### Quick Start

            ```bash
            # Run a workflow file
            clawfirm run my-workflow.whip

            # Run with a custom config
            clawfirm run -config ./config.yml my-workflow.whip

            # Install the WhipFlow skill for Claude Code
            clawfirm install-skills
            ```

            #### Example: `hello.whip`

            ```
            agent worker:
              provider: "claude-code"
              model: sonnet
              tools: ["bash", "read", "write"]
              prompt: "You are a helpful assistant."

            ask task: "What would you like me to do?"

            let result = session: worker
              prompt: "{task}"
            ```

            #### Key Concepts

            | Concept | Syntax | Description |
            |---------|--------|-------------|
            | Agent | `agent name:` | Define an AI agent with provider, model, tools |
            | Session | `session: agentName` | Spawn a subagent to execute a task |
            | Variable | `let x = session ...` | Capture session output for later use |
            | User Input | `ask key: "question?"` | Prompt user for input at runtime |
            | Parallel | `parallel:` | Run multiple sessions concurrently |
            | Loop | `loop until **condition** (max: N):` | AI-evaluated loop with safety limit |
            | Choice | `choice **criteria**:` | AI-driven branching |
            | Pipeline | `items \| map:` / `filter:` / `reduce:` | Functional data transformations |
            | Error Handling | `try: ... catch: ... finally:` | Graceful error recovery |
            | Skill | `skill commit` | Invoke a Claude Code skill |

            #### Other CLI Commands

            ```bash
            clawfirm vault init              # Initialize encrypted secret vault
            clawfirm vault set KEY=VALUE     # Store a secret
            clawfirm skill search <query>    # Search the skill registry
            clawfirm skill install <name>    # Install a skill
            clawfirm version                 # Print version
            ```

            > Full language reference: see [SKILL.md](https://github.com/${{ github.repository }}/blob/main/cmd/clawfirm/SKILL.md)

            ---

            Found an issue? Please submit an [Issue](https://github.com/${{ github.repository }}/issues)

      - name: Recreate latest release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete old latest release (if any)
          gh release delete latest --yes 2>/dev/null || true

          # Collect all asset files
          FILES=$(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \))

          # Create new latest release with assets
          gh release create latest \
            --title "Latest Release (${{ github.ref_name }})" \
            --notes "This release always points to the latest version: **${{ github.ref_name }}**

          See full release notes: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
            --latest=false \
            $FILES
