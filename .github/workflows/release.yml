name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "stable"
  NODE_VERSION: "20"
  WAILS_VERSION: "v2.12.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: clawfirm-macos-universal
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: clawfirm-linux-amd64
          - os: windows-latest
            platform: windows/amd64
            artifact: clawfirm-windows-amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cmd/desktop/frontend/package-lock.json

      # Linux: install GTK + WebKit build deps (Ubuntu 24.04 uses 4.1)
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend deps
        run: npm ci
        working-directory: cmd/desktop/frontend

      - name: Build frontend
        run: npm run build
        working-directory: cmd/desktop/frontend

      # --- Build the embedded `func` binary ---
      - name: Build func (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rm -f app/assets/func
          mkdir -p bin
          GOOS=darwin GOARCH=arm64 go build -o bin/func-arm64 ./cmd/func
          GOOS=darwin GOARCH=amd64 go build -o bin/func-amd64 ./cmd/func
          lipo -create -output app/assets/func bin/func-arm64 bin/func-amd64
          rm bin/func-arm64 bin/func-amd64

      - name: Build func (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -f app/assets/func
          go build -o app/assets/func ./cmd/func

      - name: Build func (Windows)
        if: runner.os == 'Windows'
        run: |
          Remove-Item -Force app/assets/func -ErrorAction SilentlyContinue
          go build -o app/assets/func.exe ./cmd/func
          Move-Item -Force app/assets/func.exe app/assets/func

      # --- Wails build ---
      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_OUTPUT"

      - name: Build desktop app (Linux)
        if: runner.os == 'Linux'
        run: |
          wails build \
            -tags webkit2_41 \
            -ldflags "-X github.com/ai-gateway/clawfirm/app.Version=${{ steps.version.outputs.version }}" \
            -platform ${{ matrix.platform }} \
            -o clawfirm
        working-directory: cmd/desktop

      - name: Build desktop app
        if: runner.os != 'Linux'
        shell: bash
        run: |
          wails build \
            -ldflags "-X github.com/ai-gateway/clawfirm/app.Version=${{ steps.version.outputs.version }}" \
            -platform ${{ matrix.platform }} \
            -o clawfirm
        working-directory: cmd/desktop

      # --- Package ---
      - name: Package (macOS .app → .zip)
        if: runner.os == 'macOS'
        run: |
          cd cmd/desktop/build/bin
          ditto -c -k --keepParent clawfirm.app clawfirm-macos-universal.zip

      - name: Package (Linux → .tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd cmd/desktop/build/bin
          tar czf clawfirm-linux-amd64.tar.gz clawfirm

      - name: Package (Windows → .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd cmd/desktop/build/bin
          Compress-Archive -Path clawfirm.exe -DestinationPath clawfirm-windows-amd64.zip

      # --- Upload artifact ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            cmd/desktop/build/bin/*.zip
            cmd/desktop/build/bin/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          body: |
            ## Clawfirm ${{ github.ref_name }}

            Clawfirm - AI Gateway Desktop App

            ### Downloads

            Please select the appropriate package for your operating system:

            #### macOS
            - **Universal (Apple Silicon + Intel)**: `clawfirm-macos-universal.zip`

            #### Windows
            - **x64**: `clawfirm-windows-amd64.zip`

            #### Linux
            - **x64**: `clawfirm-linux-amd64.tar.gz`

            ### Installation Notes

            - **macOS**: Unzip, drag to Applications. On first launch you may need to go to System Settings → Privacy & Security to allow the app
            - **Windows**: Unzip and run `clawfirm.exe`. SmartScreen may block it — click "More info" → "Run anyway"
            - **Linux**: Extract with `tar xzf clawfirm-linux-amd64.tar.gz` and run `./clawfirm`

            ---

            Found an issue? Please submit an [Issue](https://github.com/${{ github.repository }}/issues)
