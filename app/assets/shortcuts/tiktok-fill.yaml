        })()
    - wait: 1000
    # 不点击发布，由用户手动确认
    - capture:
        name: result_url
        eval: location.href
    - return:
      - field: 状态
        value: ✅ TikTok 内容已填写，请手动检查封面后点击 Post 发布
      - field: 标题
        value: '{{title}}'
      - field: 描述
