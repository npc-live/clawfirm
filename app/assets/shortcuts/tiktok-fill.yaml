    - wait: 2000
    - eval: >-
        (function(){
          var cover = "{{cover_v}}";
          if (!cover || cover.indexOf("{{") === 0) return "skip";
          var tabs = [...document.querySelectorAll('[role=tab], [class*=tab], button, div')]
            .filter(function(el){
              var t = el.textContent.trim().toLowerCase();
              return t === 'vertical' || t === '竖版' || t === '9:16' || t === 'portrait';
            });
          if (tabs.length > 0) { tabs[0].click(); return "switched_vertical"; }
          return "no_vertical_tab";
        })()
