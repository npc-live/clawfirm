platform: x
login_url: https://x.com
login_check:
  cookie: auth_token

commands:

  search:
    args: [keyword]
    steps:
      - open: "https://x.com/search?q={{keyword}}&src=typed_query&f=top"
      - wait: 4000
      - extract:
          selector: "[data-testid='tweet']"
          fields:
            text: "[data-testid='tweetText']"
            user: "[data-testid='User-Name']"
            link:
              selector: "a[href*='/status/']"
              attr: href
            time:
              selector: time
              attr: datetime

  like:
    args: [url]
    steps:
      - open: "{{url}}"
      - wait: 3000
      - capture:
          name: already_liked
          eval: "!!document.querySelector('[data-testid=\"unlike\"]')"
      - eval: >-
          (function(){
            var btn = document.querySelector('[data-testid="like"]') || document.querySelector('[data-testid="unlike"]');
            if (btn) { btn.click(); return true; }
            return false;
          })()
      - wait: 1000
      - capture:
          name: is_liked
          eval: "!!document.querySelector('[data-testid=\"unlike\"]')"
      - return:
          - field: 操作
            value: "{{already_liked == 'true' && '取消点赞' || '点赞成功'}}"
          - field: 状态
            value: "{{is_liked}}"

  reply:
    args: [url, text]
    steps:
      - open: "{{url}}"
      - wait: 3000
      - click:
          selector: "[data-testid='reply']"
      - wait: 1000
      - type_rich:
          selector: "[data-testid='tweetTextarea_0']"
          value: "{{text}}"
      - wait: 500
      - capture:
          name: input_text
          eval: "document.querySelector('[data-testid=\"tweetTextarea_0\"]')?.textContent?.trim() || ''"
      - click:
          selector: "[data-testid='tweetButtonInline']"
      - wait: 2000
      - return:
          - field: 状态
            value: "✅ 回复成功"
          - field: 回复内容
            value: "{{text}}"
          - field: 输入确认
            value: "{{input_text}}"

  post:
    args: [text]
    steps:
      - open: "https://x.com/home"
      - wait: 3000
      # 清空已有文本（防止草稿残留或重试时追加重复）
      - eval: >-
          (function(){
            var el = document.querySelector('[data-testid="tweetTextarea_0"]');
            if(el) { el.focus(); document.execCommand("selectAll",false,null); document.execCommand("delete",false,null); }
            return !!el;
          })()
      - wait: 300
      - type_rich:
          selector: "[data-testid='tweetTextarea_0']"
          value: "{{text}}"
      - wait: 500
      - capture:
          name: input_text
          eval: "document.querySelector('[data-testid=\"tweetTextarea_0\"]')?.textContent?.trim() || ''"
      - click:
          selector: "[data-testid='tweetButton']"
      - wait: 2500
      - capture:
          name: result_url
          eval: "location.href"
      - return:
          - field: 状态
            value: "✅ 发推成功"
          - field: 内容
            value: "{{text}}"
          - field: 输入确认
            value: "{{input_text}}"

  retweet:
    args: [url]
    steps:
      - open: "{{url}}"
      - wait: 3000
      - click:
          selector: "[data-testid='retweet']"
      - wait: 800
      - click:
          selector: "[data-testid='retweetConfirm']"
      - wait: 1500
      - return:
          - field: 状态
            value: "✅ 转推成功"
          - field: URL
            value: "{{url}}"

  # 发推 + 视频
  post_video:
    args: [video, text]   # video: 本地视频文件路径（绝对路径）
    steps:
      - open: "https://x.com/compose/post"
      - wait: 3000
      # 清空已有文本（防止草稿残留或重试时追加重复）
      - eval: >-
          (function(){
            var el = document.querySelector('[data-testid="tweetTextarea_0"]');
            if(el) { el.focus(); document.execCommand("selectAll",false,null); document.execCommand("delete",false,null); }
            return !!el;
          })()
      - wait: 300
      # 填写推文文字
      - type_rich:
          selector: "[data-testid='tweetTextarea_0']"
          value: "{{text}}"
      - wait: 500
      # 上传视频文件
      - upload:
          selector: "input[data-testid='fileInput']"
          file: "{{video}}"
      # 等待视频上传+处理完成（进度条消失 + 缩略图/预览出现）
      - wait_until:
          eval: >-
            (function(){
              var progress = document.querySelector('[role="progressbar"]');
              if (progress) return false;
              var attachments = document.querySelector('[data-testid="attachments"]');
              if (attachments && attachments.querySelector('video, img')) return true;
              var player = document.querySelector('[data-testid="videoPlayer"]');
              return !!player;
            })()
          timeout: 300000
          interval: 3000
      - wait: 1000
      - capture:
          name: input_text
          eval: "document.querySelector('[data-testid=\"tweetTextarea_0\"]')?.textContent?.trim() || ''"
      - capture:
          name: has_attachment
          eval: >-
            (function(){
              var a = document.querySelector('[data-testid="attachments"]');
              return !!(a && a.children.length > 0);
            })()
      - return:
          - field: 状态
            value: "{{has_attachment == 'true' && '✅ 视频推文已就绪' || '⚠️ 视频可能未成功附加'}}"
          - field: 推文内容
            value: "{{input_text}}"
          - field: 视频附件
            value: "{{has_attachment}}"
          - field: 操作
            value: "确认无误后点击「Post」按钮发布"

  # 发推 + 图片/视频（通用媒体上传）
  post_media:
    args: [text, media]   # media: 本地文件路径（视频或图片）
    steps:
      - open: "https://x.com/compose/post"
      - wait: 3000
      # 清空已有文本（防止草稿残留或重试时追加重复）
      - eval: >-
          (function(){
            var el = document.querySelector('[data-testid="tweetTextarea_0"]');
            if(el) { el.focus(); document.execCommand("selectAll",false,null); document.execCommand("delete",false,null); }
            return !!el;
          })()
      - wait: 300
      - type_rich:
          selector: "[data-testid='tweetTextarea_0']"
          value: "{{text}}"
      - wait: 500
      - upload:
          selector: "input[data-testid='fileInput']"
          file: "{{media}}"
      - wait_until:
          eval: >-
            (function(){
              var progress = document.querySelector('[role="progressbar"]');
              if (progress) return false;
              var attachments = document.querySelector('[data-testid="attachments"]');
              if (attachments && attachments.querySelector('video, img')) return true;
              return !!document.querySelector('[data-testid="videoPlayer"]');
            })()
          timeout: 300000
          interval: 3000
      - wait: 1000
      - capture:
          name: input_text
          eval: "document.querySelector('[data-testid=\"tweetTextarea_0\"]')?.textContent?.trim() || ''"
      - capture:
          name: has_media
          eval: >-
            (function(){
              var a = document.querySelector('[data-testid="attachments"]');
              return !!(a && a.children.length > 0);
            })()
      - return:
          - field: 状态
            value: "{{has_media == 'true' && '✅ 媒体推文已就绪' || '⚠️ 媒体可能未成功附加'}}"
          - field: 推文内容
            value: "{{input_text}}"
          - field: 媒体已上传
            value: "{{has_media}}"
          - field: 操作
            value: "确认无误后点击「Post」按钮发布"
