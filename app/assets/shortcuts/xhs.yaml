platform: xiaohongshu
login_url: https://www.xiaohongshu.com
login_check:
  cookie: web_session

commands:

  search:
    args: [keyword]
    steps:
      - open: "https://www.xiaohongshu.com/search_result?keyword={{keyword}}&source=web_explore_feed"
      - wait: 4000
      - extract:
          selector: .note-item
          fields:
            title:  ".title, [class*=title]"
            author: ".author .name, .nickname"
            link:
              selector: a
              attr: href

  hot:
    args: []
    steps:
      - open: "https://www.xiaohongshu.com/explore"
      - wait: 4000
      - extract:
          selector: .note-item
          fields:
            title:  ".title, [class*=title]"
            author: ".author .name, .nickname"
            link:
              selector: a
              attr: href

  like:
    args: [url]
    steps:
      - open: "{{url}}"
      - wait: 3000
      - capture:
          name: was_liked
          eval: "document.querySelector('.like-wrapper') ? document.querySelector('.like-wrapper').classList.contains('like-active') : false"
      - click:
          selector: ".like-wrapper"
      - wait: 500
      - capture:
          name: is_liked
          eval: "document.querySelector('.like-wrapper') ? document.querySelector('.like-wrapper').classList.contains('like-active') : false"
      - capture:
          name: count
          eval: "document.querySelector('.like-wrapper .count') ? document.querySelector('.like-wrapper .count').textContent.trim() : '?'"
      - return:
          - field: 操作
            value: "{{was_liked == 'true' && '取消点赞' || '点赞成功'}}"
          - field: 状态
            value: "{{is_liked}}"
          - field: 点赞数
            value: "{{count}}"

  comment:
    args: [url, text]
    steps:
      - open: "{{url}}"
      - wait: 3000
      - click:
          text: "说点什么..."
      - wait: 800
      - type_rich:
          selector: ".content-input"
          value: "{{text}}"
      - wait: 500
      - capture:
          name: input_text
          eval: "document.querySelector('.content-input') ? document.querySelector('.content-input').textContent.trim() : ''"
      - click:
          text: "发送"
      - wait: 1500
      - return:
          - field: 状态
            value: "✅ 评论成功"
          - field: 评论内容
            value: "{{text}}"
          - field: 输入确认
            value: "{{input_text}}"

  post_video:
    args: [video, title, desc, tags]   # video: 本地视频路径（必填）, tags: 逗号分隔话题标签（可选，最多5个）, 封面默认使用视频第一帧
    steps:
      - open: "https://creator.xiaohongshu.com/publish/publish?source=official"
      - wait: 3000
      # 等待上传按钮渲染完成（file input 是隐藏元素，不能用 wait selector）
      - wait_until:
          eval: "!!document.querySelector('input.upload-input, input.upload-input-el, input[type=file], input[accept*=video]')"
          timeout: 15000
          interval: 1000
      # 默认就在「上传视频」tab，直接上传
      - upload:
          selector: "input.upload-input, input.upload-input-el, input[type=file], input[accept*=video]"
          file: "{{video}}"
      # 等待上传完成（标题输入框出现，也可能是隐藏元素）
      - wait_until:
          eval: "!!document.querySelector('input.d-text, input[placeholder*=标题], #title')"
          timeout: 120000
          interval: 2000
      # 等待视频真正上传完成（进度条消失 / 发布按钮可点击）
      - wait_until:
          eval: >-
            (function(){
              var body = document.body.innerText;
              if (body.includes('上传完成') || body.includes('转码完成')) return true;
              var progress = document.querySelector('[class*=progress],[class*=uploading],[class*=upload-progress]');
              if (progress) {
                var text = progress.textContent || '';
                if (text.includes('100%')) return true;
              }
              var btn = [...document.querySelectorAll('button')].filter(function(b){ return b.textContent.trim() === '发布'; }).pop();
              return !!(btn && !btn.disabled);
            })()
          timeout: 300000
          interval: 3000
      - wait: 1000
      # 填写标题（小红书限制 20 字）
      - eval: >-
          (function(){
            var el = document.querySelector('input.d-text');
            if (!el) return 'no_title_input';
            var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
            setter.call(el, '{{title}}'.slice(0, 20));
            el.dispatchEvent(new Event('input', {bubbles: true}));
            return el.value;
          })()
      - wait: 500
      # 填写描述（ProseMirror 富文本）
      - type_rich:
          selector: ".tiptap.ProseMirror"
          value: "{{desc}}"
      - wait: 800
      # ── 话题标签（可选，tags 为空时全部跳过）──────────────────────────────────
      - capture:
          name: tag1
          eval: "(function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return ''; var a=t.split(',').map(function(s){return s.trim()}).filter(Boolean); return a[0]||''; })()"
      - capture:
          name: tag2
          eval: "(function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return ''; var a=t.split(',').map(function(s){return s.trim()}).filter(Boolean); return a[1]||''; })()"
      - capture:
          name: tag3
          eval: "(function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return ''; var a=t.split(',').map(function(s){return s.trim()}).filter(Boolean); return a[2]||''; })()"
      - capture:
          name: tag4
          eval: "(function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return ''; var a=t.split(',').map(function(s){return s.trim()}).filter(Boolean); return a[3]||''; })()"
      - capture:
          name: tag5
          eval: "(function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return ''; var a=t.split(',').map(function(s){return s.trim()}).filter(Boolean); return a[4]||''; })()"
      # ── Tag 1 ──
      - eval: >-
          (function(){
            var tag = "{{tag1}}";
            if (!tag) { if(document.activeElement) document.activeElement.blur(); return "skip"; }
            var editor = document.querySelector('.tiptap.ProseMirror');
            if (!editor) return "no_editor";
            editor.click(); editor.focus();
            var sel = window.getSelection();
            var range = document.createRange();
            range.selectNodeContents(editor);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
            return "ready:" + tag;
          })()
      - wait: 300
      - keyboard_insert: "#{{tag1}}"
      - wait: 2000
      - eval: >-
          (function(){
            if (!"{{tag1}}") return "skip";
            var sels = ['[class*=topic-card]','[class*=topic-item]','[class*=mention-item]','[class*=hash-tag]','[class*=suggest]','[class*=hashtag]','.tippy-content li','[role=option]','[role=listbox] > div','[class*=publish-topic]','[class*=topic-list] > div','[class*=at-list] > div'];
            for (var s = 0; s < sels.length; s++) {
              var items = document.querySelectorAll(sels[s]);
              for (var i = 0; i < items.length; i++) {
                if (items[i].offsetHeight > 0 && items[i].offsetParent !== null) { items[i].scrollIntoView({block:'center'}); var r=items[i].getBoundingClientRect(),o={bubbles:true,cancelable:true,composed:true,view:window,clientX:r.left+r.width/2,clientY:r.top+r.height/2};['pointerdown','mousedown','pointerup','mouseup','click'].forEach(function(e){items[i].dispatchEvent(new (e.startsWith('pointer')?PointerEvent:MouseEvent)(e,o));}); return "selected:" + sels[s]; }
              }
            }
            return "no_suggestion";
          })()
      - wait: 500
      # ── Tag 2 ──
      - eval: >-
          (function(){
            var tag = "{{tag2}}";
            if (!tag) { if(document.activeElement) document.activeElement.blur(); return "skip"; }
