              }
            }
            return "no_suggestion";
          })()
      - wait: 500
      # ── 话题标签结束 ────────────────────────────────────────────────────────────
      # 封面设置：使用视频第一帧（XHS 封面编辑器默认显示视频首帧，直接确认即可）
      - eval: >-
          (function(){
            var btn = [...document.querySelectorAll('span,div,a')]
              .find(function(el){ var t = el.textContent.trim(); return t === '修改封面'; });
            if (btn) { btn.scrollIntoView({block:'center'}); btn.click(); return "clicked:修改封面"; }
            var cover = document.querySelector('.cover');
            if (cover) { cover.scrollIntoView({block:'center'}); cover.click(); return "clicked:.cover"; }
            return "no_cover_btn";
          })()
      - wait: 2000
      # 等待封面编辑器对话框出现（"确定"按钮可见）
      - wait_until:
          eval: >-
            (function(){
              var btns = document.querySelectorAll('button');
              for (var i = 0; i < btns.length; i++) {
                if (btns[i].textContent.trim() === '确定' && btns[i].offsetParent !== null) return true;
              }
              return false;
            })()
          timeout: 10000
          interval: 1000
      # 直接点击确定，保存视频第一帧作为封面
      - eval: >-
          (function(){
            var btns = document.querySelectorAll('button');
            for (var i = 0; i < btns.length; i++) {
              if (btns[i].textContent.trim() === '确定' && btns[i].offsetParent !== null) {
                btns[i].click();
                return "clicked:确定";
              }
            }
            return "no_confirm_btn";
          })()
      - wait: 2000
      # 点击发布
      - eval: >-
          (function(){
            var btns = Array.from(document.querySelectorAll("button"));
            var btn = btns.filter(function(b){ return b.textContent.trim() === "发布"; }).pop();
            if(btn && !btn.disabled) { btn.click(); return true; }
            return false;
          })()
      - wait: 3000
      - capture:
          name: result_url
          eval: "location.href"
      - return:
          - field: 状态
            value: "✅ 发布成功"
          - field: 标题
            value: "{{title}}"
          - field: 描述
            value: "{{desc}}"
          - field: 跳转URL
            value: "{{result_url}}"

  post:
    args: [title, content, image]   # image: 本地图片路径（必填，小红书图文必须有图）
    steps:
      - open: "https://creator.xiaohongshu.com/publish/publish?source=official"
      - wait: 3000
      # 切到图文 tab
      - click:
          text: "上传图文"
      - wait: 1500
      # 上传图片
      - upload:
          selector: "input[type=file][accept*=jpg]"
          file: "{{image}}"
      # 等待图片上传 + 编辑器渲染
      - wait:
          selector: "input.d-text"
      # 填标题
      - fill:
          selector: "input.d-text"
          value: "{{title}}"
      - wait: 500
      # 填正文
      - type_rich:
          selector: ".tiptap.ProseMirror"
          value: "{{content}}"
      - wait: 800
      # 点发布（selector 更稳定，避免 text 匹配问题）
      - eval: >-
          (function(){
            var btns = [...document.querySelectorAll('button')];
            var btn = btns.reverse().find(function(b){ return b.textContent.trim() === '发布'; });
            if (btn && !btn.disabled) { btn.click(); return true; }
            return false;
          })()
      - wait: 2500
      - capture:
          name: result_url
          eval: "location.href"
      - return:
          - field: 状态
            value: "✅ 发布成功"
          - field: 标题
            value: "{{title}}"
          - field: 正文
            value: "{{content}}"
          - field: 跳转URL
            value: "{{result_url}}"
