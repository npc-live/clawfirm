platform: linkedin
login_url: https://www.linkedin.com
login_check:
  cookie: li_at

commands:
  post_video:
    args: [video, title, desc]
    steps:
      - open: "https://www.linkedin.com/feed/"
      - wait: 3000
      # 点击 "Start a post" / "发起帖子"
      - eval: >-
          (function(){
            var sels = ['.share-box-feed-entry__trigger','[class*=share-box-feed-entry] button',
              '[class*=share-box-feed-entry] [role=button]','[class*=share-creation] [role=button]',
              '.share-box-feed-entry__closed-share-box button'];
            for (var i = 0; i < sels.length; i++) {
              var el = document.querySelector(sels[i]);
              if (el && el.offsetParent !== null) { el.click(); return "opened:" + sels[i]; }
            }
            var labels = ['Start a post','Create a post','发起帖子','开始发帖'];
            for (var i = 0; i < labels.length; i++) {
              var el = document.querySelector('[aria-label="'+labels[i]+'"]');
              if (el) { el.click(); return "opened_aria:" + labels[i]; }
            }
            var texts = ['Start a post','Create a post','发起帖子','开始发帖','发布动态'];
            var all = document.querySelectorAll('button,[role=button],[tabindex="0"]');
            for (var i = 0; i < all.length; i++) {
              var t = (all[i].textContent||'').trim();
              for (var j = 0; j < texts.length; j++) {
                if (t.includes(texts[j])) { all[i].click(); return "opened_text:" + texts[j]; }
              }
            }
            return "no_trigger";
          })()
      - wait: 2000
      - wait_until:
          eval: >-
            (function(){
              var editor = document.querySelector('.ql-editor[contenteditable=true]') ||
                           document.querySelector('[role=textbox][contenteditable=true]') ||
                           document.querySelector('.editor-content [contenteditable=true]');
              return !!editor;
            })()
          timeout: 10000
          interval: 500
      # 点击媒体上传按钮
      - eval: >-
          (function(){
            var labels = ['Add a photo','Add a video','Add media','Media',
              '添加照片','添加视频','添加媒体','媒体','Photo','Video','Image'];
            for (var i = 0; i < labels.length; i++) {
              var el = document.querySelector('button[aria-label*="'+labels[i]+'"]');
              if (el) { el.click(); return "opened_media:" + labels[i]; }
            }
            var cls = ['.share-promoted-detour-button--media',
              '[class*=share-box] [class*=media] button',
              '[class*=share-creation] [class*=media]',
              '[class*=image-sharing-detour]'];
            for (var i = 0; i < cls.length; i++) {
              var el = document.querySelector(cls[i]);
              if (el) { el.click(); return "opened_cls:" + cls[i]; }
            }
            var btns = document.querySelectorAll('[class*=share-box--modal] button, [class*=share-creation] button, [class*=share-actions] button');
            for (var i = 0; i < btns.length; i++) {
              var label = (btns[i].getAttribute('aria-label') || '') + ' ' + btns[i].textContent;
              if (/photo|video|media|image|图片|视频|媒体/i.test(label)) {
                btns[i].click(); return "opened_scan";
              }
            }
            return "no_media_btn";
          })()
      - wait: 1500
      # 上传视频
      - upload:
          selector: "input[type=file][accept*=video], input[type=file][accept*='*'], input[type=file][accept*='.mp4'], input[type=file]"
          file: "{{video}}"
      # 等待上传完成
      - wait_until:
          eval: >-
            (function(){
              var body = document.body.innerText;
              if (body.includes('Upload complete') || body.includes('上传完成') || body.includes('Ready to post')) return true;
              var progress = document.querySelector('[role=progressbar], [class*=progress-bar], [class*=uploading]');
              if (progress && progress.offsetParent !== null) return false;
              var postBtn = document.querySelector('.share-actions__primary-action:not([disabled])') ||
                            [...document.querySelectorAll('button')]
                              .find(function(b){
                                var t = b.textContent.trim();
                                return (t === 'Post' || t === '发布') && !b.disabled;
                              });
              return !!postBtn;
            })()
          timeout: 600000
          interval: 5000
      - wait: 1500
      # 填写正文（title + desc 合并）
      - eval: >-
          (function(){
            var editor = document.querySelector('.ql-editor[contenteditable=true]') ||
                         document.querySelector('[role=textbox][contenteditable=true]') ||
                         document.querySelector('.editor-content [contenteditable=true]');
            if (!editor) return "no_editor";
            editor.focus();
            document.execCommand("selectAll", false, null);
            document.execCommand("delete", false, null);
            var title = "{{title}}";
            var desc = "{{desc}}";
            var text = title;
            if (desc && desc.indexOf("{{") !== 0) {
              text = text + "\n\n" + desc;
            }
            document.execCommand("insertText", false, text);
            return "ok";
          })()
      - wait: 500
      - capture:
          name: result_url
          eval: "location.href"
      - return:
          - field: 状态
            value: "✅ LinkedIn 视频内容已填写，请确认后点击 Post 发布"
          - field: 标题
            value: "{{title}}"
          - field: 描述
            value: "{{desc}}"
          - field: 页面URL
            value: "{{result_url}}"
