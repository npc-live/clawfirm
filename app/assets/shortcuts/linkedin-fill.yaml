platform: linkedin
login_url: https://www.linkedin.com
login_check:
  cookie: li_at

commands:
  post_video:
    args: [video, title, desc]
    steps:
      - open: "https://www.linkedin.com/feed/"
      - wait: 3000
      # 点击 "Start a post" / "发起帖子"
      - eval: >-
          (function(){
            var trigger = document.querySelector('.share-box-feed-entry__trigger') ||
                          document.querySelector('[class*=share-box-feed-entry__trigger]') ||
                          [...document.querySelectorAll('button,div[role=button],div[tabindex="0"]')]
                            .find(function(el){
                              var t = el.textContent.trim();
                              return t.includes('Start a post') || t.includes('发起帖子') ||
                                     t.includes('开始发帖') || t.includes('Create a post');
                            });
            if (trigger) { trigger.click(); return "opened"; }
            return "no_trigger";
          })()
      - wait: 2000
      - wait_until:
          eval: >-
            (function(){
              var editor = document.querySelector('.ql-editor[contenteditable=true]') ||
                           document.querySelector('[role=textbox][contenteditable=true]') ||
                           document.querySelector('.editor-content [contenteditable=true]');
              return !!editor;
            })()
          timeout: 10000
          interval: 500
      # 点击媒体上传按钮
      - eval: >-
          (function(){
            var mediaBtn =
              document.querySelector('button[aria-label*="Add a photo"]') ||
              document.querySelector('button[aria-label*="Add media"]') ||
              document.querySelector('button[aria-label*="添加媒体"]') ||
              document.querySelector('button[aria-label*="添加照片"]') ||
              document.querySelector('button[aria-label*="Photo"]') ||
              document.querySelector('button[aria-label*="Video"]') ||
              document.querySelector('button[aria-label*="视频"]') ||
              document.querySelector('.share-promoted-detour-button--media') ||
              [...document.querySelectorAll('.share-box--modal button, [class*=share-creation] button')]
                .find(function(b){
                  var label = (b.getAttribute('aria-label') || '') + ' ' + b.textContent;
                  return /photo|video|media|图片|视频|媒体/i.test(label);
                });
            if (mediaBtn) { mediaBtn.click(); return "opened_media"; }
            return "no_media_btn";
          })()
      - wait: 1500
      # 上传视频
      - upload:
          selector: "input[type=file][accept*=video], input[type=file][accept*='*'], input[type=file][accept*='.mp4'], input[type=file]"
          file: "{{video}}"
      # 等待上传完成
      - wait_until:
          eval: >-
            (function(){
              var body = document.body.innerText;
              if (body.includes('Upload complete') || body.includes('上传完成') || body.includes('Ready to post')) return true;
              var progress = document.querySelector('[role=progressbar], [class*=progress-bar], [class*=uploading]');
              if (progress && progress.offsetParent !== null) return false;
              var postBtn = document.querySelector('.share-actions__primary-action:not([disabled])') ||
                            [...document.querySelectorAll('button')]
                              .find(function(b){
                                var t = b.textContent.trim();
                                return (t === 'Post' || t === '发布') && !b.disabled;
                              });
              return !!postBtn;
            })()
          timeout: 600000
          interval: 5000
      - wait: 1500
      # 填写正文（title + desc 合并）
      - eval: >-
          (function(){
            var editor = document.querySelector('.ql-editor[contenteditable=true]') ||
                         document.querySelector('[role=textbox][contenteditable=true]') ||
                         document.querySelector('.editor-content [contenteditable=true]');
            if (!editor) return "no_editor";
            editor.focus();
            document.execCommand("selectAll", false, null);
            document.execCommand("delete", false, null);
            var title = "{{title}}";
            var desc = "{{desc}}";
            var text = title;
            if (desc && desc.indexOf("{{") !== 0) {
              text = text + "\n\n" + desc;
            }
            document.execCommand("insertText", false, text);
            return "ok";
          })()
      - wait: 500
      - capture:
          name: result_url
          eval: "location.href"
      - return:
          - field: 状态
            value: "✅ LinkedIn 视频内容已填写，请确认后点击 Post 发布"
          - field: 标题
            value: "{{title}}"
          - field: 描述
            value: "{{desc}}"
          - field: 页面URL
            value: "{{result_url}}"
