platform: channels
login_url: https://channels.weixin.qq.com
login_check:
  cookie: wxuin

# 视频号助手使用无界微前端（wujie-app），所有 DOM 在 shadow root 内。
# 选择器统一通过 eval 操作 document.querySelector("wujie-app").shadowRoot。
# 上传文件：使用 cdp_upload 步骤，通过 Runtime.evaluate + DOM.setFileInputFiles 穿透 shadow DOM。

commands:

  post:
    args: [video, title, desc, cover]   # video: 本地视频路径（必填）, cover: 封面图片路径（可选）
    steps:
      - open: "https://channels.weixin.qq.com/platform/post/create"
      - wait: 3000
      # 关闭可能出现的弹窗
      - eval: >-
          (function(){
            var sr = document.querySelector("wujie-app").shadowRoot;
            ["我知道了","不保存","取消"].forEach(function(t){
              var btn = [...sr.querySelectorAll("button")].find(function(b){ return b.textContent.trim() === t; });
              if(btn) btn.click();
            });
          })()
      - wait: 1000
      # 通过 CDP 直接设置 shadow DOM 内的 file input（无需移出 shadow root）
      - cdp_upload:
          eval: 'document.querySelector("wujie-app").shadowRoot.querySelector("input[type=file][accept*=video]")'
          file: "{{video}}"
      # 等待上传完成（发表按钮可用）
      - wait_until:
          eval: >-
            (function(){
              var sr = document.querySelector("wujie-app").shadowRoot;
              var btn = [...sr.querySelectorAll("button")].find(function(b){
                return b.textContent.trim() === "发表" && !b.disabled;
              });
              return !!btn;
            })()
          timeout: 600000
          interval: 5000
      - wait: 1500
      # 填写视频描述（div.input-editor，contenteditable）
      - eval: >-
          (function(){
            var sr = document.querySelector("wujie-app").shadowRoot;
            var el = sr.querySelector(".input-editor");
            if(!el) return "no desc editor";
            el.focus();
            document.execCommand("selectAll", false, null);
            return "ok";
          })()
      - wait: 200
      - insert_text: "{{desc}}"
      - wait: 500
      # 填写短标题（不超过16字符）
      - eval: >-
          (function(){
            var sr = document.querySelector("wujie-app").shadowRoot;
            var el = sr.querySelector("input[placeholder*=6-16]");
            if(!el) return "no title input";
            el.focus();
            var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
            setter.call(el, "{{title}}");
            el.dispatchEvent(new Event("input", {bubbles:true}));
            return "ok";
          })()
      - wait: 500
      # 封面上传（可选，cover 为空时全部跳过）
      - capture:
          name: has_cover
          eval: >-
            (function(){
              var cover = "{{cover}}";
              if (!cover || cover.indexOf("{{") === 0) return "";
              return "yes";
            })()
      # 等待封面按钮出现（视频处理完后才渲染）
      - wait_until:
          eval: >-
            (function(){
              if (!"{{has_cover}}") return true;
              var sr = document.querySelector("wujie-app").shadowRoot;
              var btn = [...sr.querySelectorAll('span,div,button')]
                .find(function(el){ var t = el.textContent.trim(); return t.includes('封面') || t.includes('更换'); });
              return !!btn;
            })()
          timeout: 120000
          interval: 3000
      - eval: >-
          (function(){
            if (!"{{has_cover}}") return "skip";
            var sr = document.querySelector("wujie-app").shadowRoot;
            var btn = [...sr.querySelectorAll('span,div,button')]
              .find(function(el){ var t = el.textContent.trim(); return t.includes('封面') || t.includes('更换'); });
            if (btn) btn.click();
            return btn ? "opened" : "no_btn";
          })()
      - wait: 2000
      # 等待封面图片 file input 出现
      - wait_until:
          eval: >-
            (function(){
              if (!"{{has_cover}}") return true;
              var sr = document.querySelector("wujie-app").shadowRoot;
              return !!sr.querySelector("input[type=file][accept*=image]");
            })()
          timeout: 10000
          interval: 1000
      - cdp_upload:
          eval: 'document.querySelector("wujie-app").shadowRoot.querySelector("input[type=file][accept*=image]")'
          file: "{{cover}}"
      - wait: 3000
      - eval: >-
          (function(){
            if (!"{{has_cover}}") return "skip";
            var sr = document.querySelector("wujie-app").shadowRoot;
            var btn = [...sr.querySelectorAll('button')]
              .find(function(b){ return b.textContent.trim() === '完成'; });
            if (btn) btn.click();
            return !!btn;
          })()
      - wait: 1000
      # 点击发表（用 accessibility ref @e20）
      - click: "@e20"
      - wait: 5000
      - capture:
          name: result_url
          eval: "location.href"
      - capture:
          name: success
          eval: >-
            (function(){
              return location.href.includes("/post/list") || location.href.includes("/platform/post");
            })()
      - return:
          - field: 状态
            value: "{{success === 'true' ? '✅ 发表成功' : '⚠️ 请检查页面'}}"
          - field: 标题
            value: "{{title}}"
          - field: 描述
            value: "{{desc}}"
          - field: 跳转URL
            value: "{{result_url}}"

  list:
    args: []
    steps:
      - open: "https://channels.weixin.qq.com/platform/post/list"
      - wait: 4000
      - capture:
          name: items
          eval: >-
            (function(){
              var sr = document.querySelector("wujie-app").shadowRoot;
              var rows = [...sr.querySelectorAll(".finder-content-item, [class*=post-item]")];
              return JSON.stringify(rows.slice(0,10).map(function(r){
                var title = r.querySelector("[class*=title], h3, h4");
                return {title: title ? title.textContent.trim().slice(0,50) : r.textContent.trim().slice(0,50)};
              }));
            })()
      - return:
          - field: 内容列表
            value: "{{items}}"
