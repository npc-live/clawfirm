platform: channels
login_url: https://channels.weixin.qq.com
login_check:
  cookie: myuin

commands:
  post:
    args: [video, title, desc, cover]
    steps:
      - open: "https://channels.weixin.qq.com/platform/post/create"
      - wait: 3000
      - eval: >-
          (function(){
            var app = document.querySelector("wujie-app");
            var sr = app && app.shadowRoot;
            var root = sr || document;
            ["我知道了","不保存","取消"].forEach(function(t){
              var btn = [...root.querySelectorAll("button")].find(function(b){ return b.textContent.trim() === t; });
              if(btn) btn.click();
            });
          })()
      - wait: 1000
      - cdp_upload:
          eval: >-
            (function(){
              var app = document.querySelector("wujie-app");
              var sr = app && app.shadowRoot;
              var root = sr || document;
              return root.querySelector("input[type=file][accept*=video]") || root.querySelector("input[type=file]");
            })()
          file: "{{video}}"
      - wait_until:
          eval: >-
            (function(){
              var app = document.querySelector("wujie-app");
              var sr = app && app.shadowRoot;
              var root = sr || document;
              var btn = [...root.querySelectorAll("button")].find(function(b){
                return b.textContent.trim() === "发表" && !b.disabled;
              });
              return !!btn;
            })()
          timeout: 600000
          interval: 5000
      - wait: 1500
      - eval: >-
          (function(){
            var app = document.querySelector("wujie-app");
            var sr = app && app.shadowRoot;
            var root = sr || document;
            var el = root.querySelector(".input-editor");
            if(!el) return "no desc editor";
            el.focus();
            document.execCommand("selectAll", false, null);
            return "ok";
          })()
      - wait: 200
      - insert_text: "{{desc}}"
      - wait: 500
      - eval: >-
          (function(){
            var app = document.querySelector("wujie-app");
            var sr = app && app.shadowRoot;
            var root = sr || document;
            var el = root.querySelector("input[placeholder*=6-16]");
            if(!el) return "no title input";
            el.focus();
            var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
            setter.call(el, "{{title}}");
            el.dispatchEvent(new Event("input", {bubbles:true}));
            return "ok";
          })()
      - wait: 500
      # 封面上传（可选，cover 为空时自动跳过；shadow DOM 需先移出 file input）
      - eval: >-
          (function(){
            var cover = "{{cover}}";
            if (!cover || cover.indexOf("{{") === 0) return "no_cover";
            var app = document.querySelector("wujie-app");
            var sr = app && app.shadowRoot;
            var root = sr || document;
            var btn = [...root.querySelectorAll('span,div,button')]
              .find(function(el){ var t = el.textContent.trim(); return t.includes('封面') || t.includes('更换'); });
            if (btn) btn.click();
            return btn ? "opened" : "no_btn";
          })()
      - wait: 2000
      - cdp_upload:
          eval: >-
            (function(){
              var app = document.querySelector("wujie-app");
              var sr = app && app.shadowRoot;
              var root = sr || document;
              return root.querySelector("input[type=file][accept*=image]");
            })()
          file: "{{cover}}"
      - wait: 3000
      - eval: >-
          (function(){
            var app = document.querySelector("wujie-app");
            var sr = app && app.shadowRoot;
            var root = sr || document;
            var btn = [...root.querySelectorAll('button')]
              .find(function(b){ return b.textContent.trim() === '完成'; });
            if (btn) btn.click();
            return !!btn;
          })()
      - wait: 1000
      - capture:
          name: result_url
          eval: "location.href"
      - return:
          - field: 状态
            value: "✅ 视频号内容已填写，请手动确认后点击发表"
          - field: 标题
            value: "{{title}}"
          - field: 页面URL
            value: "{{result_url}}"
