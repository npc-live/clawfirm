                var desc = descEl ? descEl.textContent.trim().slice(0, 120) : '';
                var authorEl = card.querySelector('[data-e2e="explore-card-user-unique-id"], [class*=author], [class*=user-name]');
                var author = authorEl ? authorEl.textContent.trim() : '';
                if (!author) {
                  var aLink = card.querySelector('a[href*="/@"]');
                  if (aLink) { var m = aLink.href.match(/@([^/?]+)/); author = m ? '@' + m[1] : ''; }
                }
                var views = '';
                var statsEls = card.querySelectorAll('strong, [class*=Count], [class*=count], [class*=Stats] span');
                for (var s = 0; s < statsEls.length; s++) {
                  var t = statsEls[s].textContent.trim();
                  if (/^[\d.]+\s*[KMBkmb]?$/.test(t) || /^\d[\d,.]*$/.test(t)) { views = t; break; }
                }
                results.push({ rank: results.length + 1, link: link, desc: desc, author: author, views: views });
              });
              return JSON.stringify(results);
            })()
      - return:
          - field: 趋势视频
            value: "{{trending}}"

  # ── 下载视频 ──────────────────────────────────────────────────────────────────
  download:
    args: [url]
    steps:
      - open: "{{url}}"
      - wait: 5000
      # 关闭弹窗
      - eval: >-
          (function(){
            var btns = document.querySelectorAll(
              '[data-e2e="modal-close-inner-button"], [class*=modal] button, [class*=dialog] button'
            );
            btns.forEach(function(b){
              var t = b.textContent.trim().toLowerCase();
              if (t === 'not now' || t === 'close' || t === '关闭' ||
                  b.getAttribute('data-e2e') === 'modal-close-inner-button') b.click();
            });
            return btns.length;
          })()
      - wait: 1500
      # 提取视频信息
      - capture:
          name: video_desc
          eval: >-
            (function(){
              var el = document.querySelector('[data-e2e="browse-video-desc"], [data-e2e="video-desc"]') ||
                       document.querySelector('h1') ||
                       document.querySelector('[class*=SpanText], [class*=desc], [class*=caption]');
              return el ? el.textContent.trim().slice(0, 120) : 'untitled';
            })()
      - capture:
          name: video_author
          eval: >-
            (function(){
              var el = document.querySelector('[data-e2e="browse-username"], [data-e2e="video-author-uniqueid"]') ||
                       document.querySelector('a[href*="/@"] [class*=SpanUniqueId], a[href*="/@"] span');
              if (el) return el.textContent.trim();
              var a = document.querySelector('a[href*="/@"]');
              if (a) { var m = a.href.match(/@([^/?]+)/); return m ? '@' + m[1] : ''; }
              return 'unknown';
            })()
      - capture:
          name: video_id
          eval: >-
            (function(){
              var m = location.href.match(/\/video\/(\d+)/);
              return m ? m[1] : '';
            })()
      # 提取互动数据
      - capture:
          name: stats
          eval: >-
            (function(){
              var likes = '', comments = '', shares = '', saves = '';
              var likeEl = document.querySelector('[data-e2e="like-count"], [data-e2e="browse-like-count"]');
              if (likeEl) likes = likeEl.textContent.trim();
              var commentEl = document.querySelector('[data-e2e="comment-count"], [data-e2e="browse-comment-count"]');
              if (commentEl) comments = commentEl.textContent.trim();
              var shareEl = document.querySelector('[data-e2e="share-count"], [data-e2e="browse-share-count"]');
              if (shareEl) shares = shareEl.textContent.trim();
              var saveEl = document.querySelector('[data-e2e="undefined-count"], [data-e2e="browse-save-count"]');
              if (saveEl) saves = saveEl.textContent.trim();
              return JSON.stringify({ likes: likes, comments: comments, shares: shares, saves: saves });
            })()
      # 尝试下载视频
      - capture:
          name: dl_result
          eval: >-
            (async function(){
              var videoId = (location.href.match(/\/video\/(\d+)/) || [])[1] || 'unknown';
              var desc = (document.querySelector('[data-e2e="browse-video-desc"], [data-e2e="video-desc"], h1') || {}).textContent || 'untitled';
              desc = desc.trim().slice(0, 60).replace(/[\\/:*?"<>|\r\n\t]/g, '');
              var filename = 'tiktok_' + desc + '_' + videoId;
              var video = document.querySelector('video');
              var videoUrl = video ? (video.currentSrc || video.src) : '';
              if (videoUrl && !videoUrl.startsWith('blob:')) {
                try {
                  var resp = await fetch(videoUrl);
                  var blob = await resp.blob();
                  var a = document.createElement('a');
                  a.href = URL.createObjectURL(blob);
                  a.download = filename + '.mp4';
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  URL.revokeObjectURL(a.href);
                  return 'downloading';
                } catch(e) { return 'fetch_error: ' + e.message; }
              }
              if (videoUrl && videoUrl.startsWith('blob:')) {
                try {
                  var nd = document.getElementById('__NEXT_DATA__');
                  if (nd) {
                    var json = JSON.parse(nd.textContent);
                    var playAddr = '';
                    var str = JSON.stringify(json);
                    var m = str.match(/"playAddr":"(https?:[^"]+)"/);
                    if (m) playAddr = m[1].replace(/\\u002F/g, '/');
                    if (!playAddr) {
                      m = str.match(/"downloadAddr":"(https?:[^"]+)"/);
                      if (m) playAddr = m[1].replace(/\\u002F/g, '/');
                    }
                    if (playAddr) {
                      var r2 = await fetch(playAddr);
                      var b2 = await r2.blob();
                      var a2 = document.createElement('a');
                      a2.href = URL.createObjectURL(b2);
                      a2.download = filename + '.mp4';
                      document.body.appendChild(a2);
                      a2.click();
                      document.body.removeChild(a2);
                      URL.revokeObjectURL(a2.href);
                      return 'downloading_from_next_data';
                    }
                  }
                } catch(e2) {}
                return 'blob_url_cannot_direct_download';
              }
              return 'no_video_found';
            })()
      - wait: 5000
      - return:
          - field: 作者
            value: "{{video_author}}"
          - field: 描述
            value: "{{video_desc}}"
          - field: 视频ID
            value: "{{video_id}}"
          - field: 互动数据
            value: "{{stats}}"
          - field: 下载状态
            value: "{{dl_result}}"

  # ── 点赞视频 ──────────────────────────────────────────────────────────────────
  like:
    args: [url]
    steps:
      - open: "{{url}}"
      - wait: 4000
      - capture:
          name: before
          eval: >-
            (function(){
              var btn = document.querySelector('[data-e2e="like-icon"], [class*=like-button], button[aria-label*="Like"]');
              if (!btn) return "no_btn";
              return btn.classList.contains('active') || btn.getAttribute('aria-pressed') === 'true' ? 'liked' : 'not_liked';
            })()
      - eval: >-
          (function(){
            var btn = document.querySelector('[data-e2e="like-icon"], [class*=like-button], button[aria-label*="Like"]');
            if (btn) { btn.click(); return true; }
            return false;
          })()
      - wait: 1500
      - capture:
          name: after
          eval: >-
            (function(){
              var btn = document.querySelector('[data-e2e="like-icon"], [class*=like-button], button[aria-label*="Like"]');
              if (!btn) return "unknown";
              return btn.classList.contains('active') || btn.getAttribute('aria-pressed') === 'true' ? 'liked' : 'not_liked';
            })()
      - return:
          - field: 操作
            value: "{{before === 'liked' ? '取消点赞' : '点赞成功'}}"
          - field: 当前状态
            value: "{{after === 'liked' ? '✅ 已点赞' : '❌ 未点赞'}}"

  # ── 发表评论 ──────────────────────────────────────────────────────────────────
  comment:
    args: [url, text]
    steps:
      - open: "{{url}}"
      - wait: 4000
      # 点击评论输入区域
      - eval: >-
          (function(){
            var placeholder = document.querySelector('[data-e2e="comment-input"], [class*=comment-input], [placeholder*="comment" i], [placeholder*="评论"]');
            if (placeholder) { placeholder.click(); return "clicked"; }
            return "no_placeholder";
          })()
      - wait: 1200
      # focus 评论编辑器
      - eval: >-
          (function(){
            var editor = document.querySelector('[contenteditable="true"]') ||
                         document.querySelector('.public-DraftEditor-content') ||
                         document.querySelector('[data-e2e="comment-input"] [contenteditable]');
            if (editor) { editor.focus(); return true; }
            return false;
          })()
      - wait: 300
      # 插入评论文字
      - keyboard_insert: "{{text}}"
      - wait: 600
      # 发送评论
      - eval: >-
          (function(){
            var btn = document.querySelector('[data-e2e="comment-post"], [class*=comment-post]') ||
                      [...document.querySelectorAll('button')]
                        .find(function(b){
                          var t = b.textContent.trim();
                          return (t === 'Post' || t === '发布' || t === 'Reply' || t === '回复') && !b.disabled;
                        });
            if (btn) { btn.click(); return true; }
            return false;
          })()
      - wait: 2000
      - return:
          - field: 状态
            value: "✅ TikTok 评论成功"
          - field: 评论内容
            value: "{{text}}"

  # ── 关注用户 ──────────────────────────────────────────────────────────────────
  follow:
    args: [url]
    steps:
      - open: "{{url}}"
      - wait: 4000
      - capture:
          name: before
          eval: >-
            (function(){
              var btn = document.querySelector('[data-e2e="follow-button"], button[class*=follow]');
              if (!btn) return "no_btn";
              var t = btn.textContent.trim().toLowerCase();
              return (t === 'following' || t === '已关注') ? 'following' : 'not_following';
            })()
      - eval: >-
          (function(){
            var btn = document.querySelector('[data-e2e="follow-button"], button[class*=follow]');
            if (btn) { btn.click(); return true; }
            return false;
          })()
      - wait: 1500
      - return:
          - field: 操作
            value: "{{before === 'following' ? '取消关注' : '关注成功'}}"
