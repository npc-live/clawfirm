platform: bilibili
login_url: https://www.bilibili.com
login_check:
  cookie: SESSDATA
commands:
  post:
    args:
    - video
    - title
    - desc
    - cover
    - tags
    - chapters
    steps:
    - open: https://member.bilibili.com/platform/upload/video/frame
    - wait: 4000
    - eval: "(function(){\n  var btn = [...document.querySelectorAll(\"button\")].find(function(b){\
        \ return b.textContent.trim() === \"知道了\"; });\n  if(btn) btn.click();\n \
        \ return !!btn;\n})()"
    - wait: 500
    - cdp_upload:
        eval: "document.querySelector(\"input[accept*='.mp4']\")"
        file: '{{video}}'
    - wait:
        selector: input[placeholder='请输入稿件标题']
    - wait: 1000
    - wait_until:
        eval: "(function(){\n  var body = document.body.innerText;\n  if (body.includes('上传完成')\
          \ && !body.includes('上传中')) return true;\n  var progress = document.querySelector('.upload-progress,\
          \ [class*=progress], [class*=uploading]');\n  if (progress) {\n    var text\
          \ = progress.textContent || '';\n    if (text.includes('100%')) return true;\n\
          \  }\n  var btn = document.querySelector('span.submit-add');\n  if (btn)\
          \ {\n    var parent = btn.closest('button') || btn.parentElement;\n    if\
          \ (parent && !parent.classList.contains('disabled') && !parent.hasAttribute('disabled'))\
          \ return true;\n  }\n  return false;\n})()"
        timeout: 300000
        interval: 3000
    - eval: >-
        (function(){
          ["暂不考虑","知道了"].forEach(function(text){
            var btn = [...document.querySelectorAll("button")].find(function(b){ return b.textContent.trim() === text; });
            if(btn) btn.click();
          });
        })()
    - wait: 800
    - fill:
        selector: input[placeholder='请输入稿件标题']
        value: '{{title}}'
    - wait: 300
    # 清空 Quill 编辑器已有内容
    - eval: >-
        (function(){
          var el = document.querySelector(".ql-editor");
          if(!el) return false;
          el.focus();
          el.innerHTML = '<p><br></p>';
          return true;
        })()
    - wait: 300
    # 将章节时间戳追加到描述末尾（B站描述中的时间戳自动识别为章节）
    - capture:
        name: full_desc
        eval: >-
          (function(){
            var ch = "{{chapters}}";
            var desc = "{{desc}}";
            if (ch && ch.indexOf("{{") !== 0 && ch.length > 0) return desc + "\n\n" + ch;
            return desc;
          })()
    # 填写描述（用 type_rich 代替已废弃的 execCommand）
    - type_rich:
        selector: ".ql-editor"
        value: "{{full_desc}}"
    - wait: 500
    - eval: "(function(){\n  var cover = \"{{cover}}\";\n  if (!cover || cover.indexOf(\"\
        {{\") === 0) return \"no_cover\";\n  return \"has_cover\";\n})()"
    # 点击封面按钮（兼容多种文字状态）
    - eval: >-
        (function(){
          var btn = [...document.querySelectorAll('span,div,button')]
            .find(function(el){ var t = el.textContent.trim(); return t === '封面设置' || t === '更换封面' || t === '设置封面' || t === '上传封面'; });
          if (btn) { btn.scrollIntoView({block:'center'}); btn.click(); return "clicked:" + btn.textContent.trim(); }
          return "no_cover_btn";
        })()
    - wait: 2000
    - eval: >-
        (function(){
          var btn = [...document.querySelectorAll('span,div,button')]
            .find(function(el){ return el.textContent.trim() === '上传封面'; });
          if (btn) { btn.click(); return "clicked"; }
          return "already_in_upload";
        })()
    - wait: 1000
    - cdp_upload:
        eval: "document.querySelector('input[type=file][accept*=image]') || document.querySelector(\"input[type=file][accept*='.jpg']\") || document.querySelector(\"input[type=file][accept*='.png']\")"
        file: '{{cover}}'
    - wait: 3000
    - wait: 5000
    - click:
        selector: ".cover-editor-button .button.submit"
    - wait: 1000
    # ── 标签输入（可选，tags 为逗号分隔，最多7个）──────────────────────────────
    # 先清除系统自动推荐的不相关标签
    - eval: >-
        (function(){
          var tags = "{{tags}}";
          if (!tags || tags.indexOf("{{") === 0) return "no_tags";
          var preWrp = document.querySelector(".tag-pre-wrp");
          if (preWrp) {
            var closes = preWrp.querySelectorAll("[class*=close], [class*=remove], .icon-close");
            var n = 0;
            closes.forEach(function(c){ if (typeof c.click === 'function') { c.click(); n++; } });
            return "cleared:" + n;
          }
          return "no_pre_wrp";
        })()
    - wait: 500
    - capture:
        name: tag1
        eval: "(function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return ''; return t.split(',').map(function(s){return s.trim()}).filter(Boolean)[0]||''; })()"
    - capture:
        name: tag2
        eval: "(function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return ''; return t.split(',').map(function(s){return s.trim()}).filter(Boolean)[1]||''; })()"
    - capture:
        name: tag3
        eval: "(function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return ''; return t.split(',').map(function(s){return s.trim()}).filter(Boolean)[2]||''; })()"
    - capture:
        name: tag4
        eval: "(function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return ''; return t.split(',').map(function(s){return s.trim()}).filter(Boolean)[3]||''; })()"
    - capture:
        name: tag5
        eval: "(function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return ''; return t.split(',').map(function(s){return s.trim()}).filter(Boolean)[4]||''; })()"
    # Tag 1
    - eval: >-
        (function(){
          var tag = "{{tag1}}";
          if (!tag) return "skip";
          var input = document.querySelector("input[placeholder*='创建标签']");
          if (!input) return "no_input";
          input.focus();
          var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
          setter.call(input, tag);
          input.dispatchEvent(new Event('input', {bubbles: true}));
          return "typed:" + tag;
        })()
    - wait: 300
    - eval: >-
        (function(){
          if (!"{{tag1}}") return "skip";
          var input = document.querySelector("input[placeholder*='创建标签']");
          if (!input) return "no_input";
          return "ready_for_enter";
        })()
    - key: "Enter"
    - wait: 500
    # Tag 2
    - eval: >-
        (function(){
          var tag = "{{tag2}}";
          if (!tag) return "skip";
          var input = document.querySelector("input[placeholder*='创建标签']");
          if (!input) return "no_input";
          input.focus();
          var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
          setter.call(input, tag);
          input.dispatchEvent(new Event('input', {bubbles: true}));
          return "typed:" + tag;
        })()
    - wait: 300
    - eval: >-
        (function(){
          if (!"{{tag2}}") return "skip";
          var input = document.querySelector("input[placeholder*='创建标签']");
          if (!input) return "no_input";
          return "ready_for_enter";
        })()
    - key: "Enter"
    - wait: 500
    # Tag 3
    - eval: >-
        (function(){
          var tag = "{{tag3}}";
          if (!tag) return "skip";
          var input = document.querySelector("input[placeholder*='创建标签']");
          if (!input) return "no_input";
          input.focus();
          var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
          setter.call(input, tag);
          input.dispatchEvent(new Event('input', {bubbles: true}));
          return "typed:" + tag;
        })()
    - wait: 300
    - eval: >-
        (function(){
          if (!"{{tag3}}") return "skip";
          var input = document.querySelector("input[placeholder*='创建标签']");
          if (!input) return "no_input";
          return "ready_for_enter";
        })()
    - key: "Enter"
    - wait: 500
    # Tag 4
    - eval: >-
        (function(){
          var tag = "{{tag4}}";
          if (!tag) return "skip";
          var input = document.querySelector("input[placeholder*='创建标签']");
          if (!input) return "no_input";
          input.focus();
          var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
          setter.call(input, tag);
          input.dispatchEvent(new Event('input', {bubbles: true}));
          return "typed:" + tag;
        })()
    - wait: 300
    - eval: >-
        (function(){
          if (!"{{tag4}}") return "skip";
          var input = document.querySelector("input[placeholder*='创建标签']");
          if (!input) return "no_input";
          return "ready_for_enter";
        })()
    - key: "Enter"
    - wait: 500
    # Tag 5
    - eval: >-
        (function(){
          var tag = "{{tag5}}";
          if (!tag) return "skip";
          var input = document.querySelector("input[placeholder*='创建标签']");
          if (!input) return "no_input";
          input.focus();
          var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
          setter.call(input, tag);
          input.dispatchEvent(new Event('input', {bubbles: true}));
          return "typed:" + tag;
        })()
    - wait: 300
    - eval: >-
        (function(){
          if (!"{{tag5}}") return "skip";
          var input = document.querySelector("input[placeholder*='创建标签']");
          if (!input) return "no_input";
          return "ready_for_enter";
        })()
    - key: "Enter"
    - wait: 500
    # ── 标签结束 ──────────────────────────────────────────────────────────────────
    - eval: document.querySelector('span.submit-add')?.scrollIntoView({block:'center'})
    - wait: 500
    - capture:
        name: result_url
        eval: location.href
    - return:
      - field: 状态
        value: ✅ 内容已填写，请手动确认分区后点击立即投稿
      - field: 标题
        value: '{{title}}'
      - field: 标签
        value: '{{tags}}'
      - field: 页面URL
        value: '{{result_url}}'
