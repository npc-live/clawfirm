platform: xiaohongshu
login_url: https://www.xiaohongshu.com
login_check:
  cookie: web_session
commands:
  post_video:
    args:
    - video
    - title
    - desc
    - tags
    steps:
    - open: https://creator.xiaohongshu.com/publish/publish?source=official
    - wait: 3000
    - wait_until:
        eval: '!!document.querySelector(''input.upload-input, input.upload-input-el,
          input[type=file], input[accept*=video]'')'
        timeout: 15000
        interval: 1000
    - upload:
        selector: input.upload-input, input.upload-input-el, input[type=file], input[accept*=video]
        file: '{{video}}'
    - wait_until:
        eval: '!!document.querySelector(''input.d-text, input[placeholder*=标题], #title'')'
        timeout: 120000
        interval: 2000
    # 检测文件已被接受（"重新上传"出现即可开始填表，无需等上传完成）
    - wait_until:
        eval: "(function(){\n  var body = document.body.innerText;\n  return body.includes('重新上传');\n})()"
        timeout: 120000
        interval: 2000
    - wait: 1000
    - eval: "(function(){\n  var el = document.querySelector('input.d-text');\n  if\
        \ (!el) return 'no_title_input';\n  var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,\
        \ 'value').set;\n  setter.call(el, '{{title}}'.slice(0, 20));\n  el.dispatchEvent(new\
        \ Event('input', {bubbles: true}));\n  return el.value;\n})()"
    - wait: 500
    - type_rich:
        selector: .tiptap.ProseMirror
        value: '{{desc}}'
    - wait: 800
    - capture:
        name: tag1
        eval: (function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return '';
          var a=t.split(',').map(function(s){return s.trim()}).filter(Boolean); return
          a[0]||''; })()
    - capture:
        name: tag2
        eval: (function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return '';
          var a=t.split(',').map(function(s){return s.trim()}).filter(Boolean); return
          a[1]||''; })()
    - capture:
        name: tag3
        eval: (function(){ var t='{{tags}}'; if(!t||t.indexOf('{{')==0) return '';
