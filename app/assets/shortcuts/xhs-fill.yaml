    - wait: 500
    - eval: "(function(){\n  var cover = \"{{cover}}\";\n  if (!cover || cover.indexOf(\"\
        {{\") === 0) return \"no_cover\";\n  return \"has_cover\";\n})()"
    - click:
        text: 设置封面
    - wait: 2000
    - click:
        text: 本地上传
    - wait: 1000
    - upload:
        selector: input[type=file][accept*=image]
        file: '{{cover}}'
    - wait: 3000
    - click:
        text: 完成
    - wait: 1000
    - capture:
        name: result_url
        eval: location.href
    - return:
      - field: 状态
        value: ✅ 内容已填写，请手动确认后点击发布
