    - wait: 500
    - eval: "(function(){\n  var btn = [...document.querySelectorAll('span,div,a')].find(function(el){\
        \ return el.textContent.trim() === '修改封面'; });\n  if (btn) { btn.scrollIntoView({block:'center'});\
        \ btn.click(); return 'clicked:修改封面'; }\n  var cover = document.querySelector('.cover');\n\
        \  if (cover) { cover.scrollIntoView({block:'center'}); cover.click(); return\
        \ 'clicked:.cover'; }\n  return 'no_cover_btn';\n})()"
    - wait: 2000
    - wait_until:
        eval: "(function(){\n  var btns = document.querySelectorAll('button');\n  for\
          \ (var i = 0; i < btns.length; i++) {\n    if (btns[i].textContent.trim()\
          \ === '确定' && btns[i].offsetParent !== null) return true;\n  }\n  return\
          \ false;\n})()"
        timeout: 10000
        interval: 1000
    - eval: "(function(){\n  var btns = document.querySelectorAll('button');\n  for\
        \ (var i = 0; i < btns.length; i++) {\n    if (btns[i].textContent.trim() ===\
        \ '确定' && btns[i].offsetParent !== null) {\n      btns[i].click();\n      return\
        \ 'clicked:确定';\n    }\n  }\n  return 'no_confirm_btn';\n})()"
    - wait: 2000
    - capture:
        name: result_url
        eval: location.href
    - return:
      - field: 状态
        value: ✅ 内容已填写，请手动确认后点击发布
      - field: 标题
        value: '{{title}}'
      - field: 描述
        value: '{{desc}}'
      - field: 页面URL
        value: '{{result_url}}'
