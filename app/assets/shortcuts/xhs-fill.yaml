          var a=t.split(',').map(function(s){return s.trim()}).filter(Boolean); return
          a[4]||''; })()
    - eval: "(function(){\n  var tag = \"{{tag1}}\";\n  if (!tag) { if(document.activeElement)\
        \ document.activeElement.blur(); return \"skip\"; }\n  var editor = document.querySelector('.tiptap.ProseMirror');\n\
        \  if (!editor) return \"no_editor\";\n  editor.click(); editor.focus();\n\
        \  var sel = window.getSelection();\n  var range = document.createRange();\n\
        \  range.selectNodeContents(editor);\n  range.collapse(false);\n  sel.removeAllRanges();\n\
        \  sel.addRange(range);\n  return \"ready:\" + tag;\n})()"
    - wait: 300
    - keyboard_insert: '#{{tag1}}'
    - wait: 2000
    - eval: "(function(){\n  if (!\"{{tag1}}\") return \"skip\";\n  var sels = ['[class*=topic-card]','[class*=topic-item]','[class*=mention-item]','[class*=hash-tag]','[class*=suggest]','[class*=hashtag]','.tippy-content\
        \ li','[role=option]','[role=listbox] > div','[class*=publish-topic]','[class*=topic-list]\
        \ > div','[class*=at-list] > div'];\n  for (var s = 0; s < sels.length; s++)\
        \ {\n    var items = document.querySelectorAll(sels[s]);\n    for (var i =\
        \ 0; i < items.length; i++) {\n      if (items[i].offsetHeight > 0 && items[i].offsetParent\
        \ !== null) { items[i].scrollIntoView({block:'center'}); var r=items[i].getBoundingClientRect(),o={bubbles:true,cancelable:true,composed:true,view:window,clientX:r.left+r.width/2,clientY:r.top+r.height/2};['pointerdown','mousedown','pointerup','mouseup','click'].forEach(function(e){items[i].dispatchEvent(new (e.startsWith('pointer')?PointerEvent:MouseEvent)(e,o));});\
        \ return \"selected:\" + sels[s]; }\n    }\n  }\n  return \"no_suggestion\"\
        ;\n})()"
