platform: douyin
login_url: https://www.douyin.com
login_check:
  cookie: passport_csrf_token

commands:

  search:
    args: [keyword]
    steps:
      - open: "https://www.douyin.com/search/{{keyword}}?type=video"
      - wait: 4000
      - extract:
          selector: "a[href*='/video/']"
          fields:
            link:
              selector: "a[href*='/video/']"
              attr: href
            text: ".kgnD1hJB, [class*=title], [class*=desc]"

  like:
    args: [url]
    steps:
      - open: "{{url}}"
      - wait: 4000
      - capture:
          name: state_before
          eval: "document.querySelector('[data-e2e=\"video-player-digg\"]')?.getAttribute('data-e2e-state') || ''"
      - key: "z"
      - wait: 1000
      - capture:
          name: state_after
          eval: "document.querySelector('[data-e2e=\"video-player-digg\"]')?.getAttribute('data-e2e-state') || ''"
      - return:
          - field: 操作
            value: "{{state_before === 'video-player-no-digged' ? '点赞成功' : '取消点赞'}}"
          - field: 状态
            value: "{{state_after}}"

  comment:
    args: [url, text]
    steps:
      - open: "{{url}}"
      - wait: 4000
      # X 键打开评论区
      - key: "x"
      - wait: 1200
      # PointerEvent 激活 Draft.js 输入框（触发 React 事件）
      - eval: >-
          (function(){
            var el = document.querySelector('.lFk180Rt') || document.querySelector('.GXmFLge7');
            if(!el) return false;
            ['pointerdown','mousedown','pointerup','mouseup','click'].forEach(function(evt){
              el.dispatchEvent(new (evt.startsWith('pointer') ? PointerEvent : MouseEvent)(evt, {bubbles:true,cancelable:true,composed:true,view:window}));
            });
            return true;
          })()
      - wait: 1200
      # focus Draft.js 编辑器
      - eval: "document.querySelector('.notranslate.public-DraftEditor-content')?.focus()"
      - wait: 300
      # 插入文字（CDP char 事件，正确触发 Draft.js EditorState 更新）
      - keyboard_insert: "{{text}}"
      - wait: 600
      - capture:
          name: input_text
          eval: "document.querySelector('.notranslate.public-DraftEditor-content')?.textContent?.trim() || ''"
      # Enter 发送
      - key: "Enter"
      - wait: 2000
      - return:
          - field: 状态
            value: "✅ 评论成功"
          - field: 评论内容
            value: "{{text}}"
          - field: 输入确认
            value: "{{input_text}}"

  follow:
    args: [url]
    steps:
      - open: "{{url}}"
      - wait: 4000
      # JbfEzak6 = the + follow button on the avatar in the right sidebar
      # present = not yet following; absent = already following
      - capture:
          name: has_follow_btn
          eval: "!!document.querySelector('.JbfEzak6')"
      - eval: >-
          (function(){
            var el = document.querySelector('.JbfEzak6');
            if(el) el.click();
            return !!el;
          })()
      - wait: 1000
      - capture:
          name: btn_after
          eval: "!!document.querySelector('.JbfEzak6')"
      - return:
          - field: 操作
            value: "{{has_follow_btn === 'true' ? '关注成功' : '已在关注中（无操作）'}}"
          - field: 关注按钮消失
            value: "{{btn_after === 'false' ? '✅ 是' : '⚠️ 否'}}"

  download:
    args: [url]
    steps:
      - open: "{{url}}"
      - wait: 5000
      # 判断类型：视频 or 图文
      - capture:
          name: media_type
          eval: >-
            (function(){
              if (location.href.includes('/note/') || location.href.includes('/gallery/') || location.href.includes('/slides/')) return 'gallery';
              if (document.querySelector('img.note-image, .note-image-list, [data-e2e="note-slide"]')) return 'gallery';
              return 'video';
            })()
      # 获取作品描述/标题 — 用 h1 (抖音视频页的标题)
      - capture:
          name: desc
          eval: >-
            (function(){
              var el = document.querySelector('h1') ||
                       document.querySelector('[data-e2e="video-desc"]') ||
                       document.querySelector('.title-container');
              return el ? el.textContent.trim().slice(0, 80) : 'untitled';
            })()
      # 获取作者名 — "已关注"按钮的兄弟 <a> 或 h1 上方的用户链接
      - capture:
          name: author
          eval: >-
            (function(){
              var followBtn = [...document.querySelectorAll('button')].find(function(b){
                return b.textContent.includes('已关注') || b.textContent.includes('关注');
              });
              if (followBtn) {
                var p = followBtn.parentElement;
                for (var i = 0; i < 3 && p; i++) {
                  var a = p.querySelector('a[href*="/user/"]');
                  if (a && a.textContent.trim()) return a.textContent.trim().replace(/[\\/:*?"<>|]/g, '');
                  p = p.parentElement;
                }
              }
              var links = document.querySelectorAll('a[href*="/user/"]');
              for (var j = 0; j < links.length; j++) {
                var t = links[j].textContent.trim();
                if (t && t.length > 1 && t.length < 30 && !t.includes('我的')) return t.replace(/[\\/:*?"<>|]/g, '');
              }
              return 'unknown';
            })()
      # 获取 aweme_id
      - capture:
          name: aweme_id
          eval: >-
            (function(){
              var m = location.href.match(/\/(video|note|gallery|slides)\/(\d+)/);
              if (m) return m[2];
              var m2 = location.href.match(/modal_id=(\d+)/);
              return m2 ? m2[1] : '';
            })()
      # 用浏览器下载 — video.currentSrc 才有真实 URL (非 video.src)
      - capture:
          name: dl_result
          eval: >-
            (async function(){
              var awemeId = (location.href.match(/\/(video|note|gallery|slides)\/(\d+)/) || [])[2] || 'unknown';
              var h1 = document.querySelector('h1');
              var desc = h1 ? h1.textContent.trim().slice(0, 60) : 'untitled';
              desc = desc.replace(/[\\/:*?"<>|\r\n\t]/g, '');
              var filename = desc + '_' + awemeId;

              var video = document.querySelector('video');
              var videoUrl = video ? (video.currentSrc || video.src) : '';
              if (videoUrl && !videoUrl.startsWith('blob:')) {
                try {
                  var resp = await fetch(videoUrl);
                  var blob = await resp.blob();
                  var a = document.createElement('a');
                  a.href = URL.createObjectURL(blob);
                  a.download = filename + '.mp4';
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  URL.revokeObjectURL(a.href);
                  return 'video_downloading';
                } catch(e) { return 'video_fetch_error: ' + e.message; }
              }

              var imgs = document.querySelectorAll(
                '[data-e2e="note-slide"] img, .note-image-list img, .swiper-slide img'
              );
              if (imgs.length === 0) {
                imgs = document.querySelectorAll('img[src*="snssdk"], img[src*="douyinpic"], img[src*="byteimg"]');
              }
              var count = 0;
              for (var i = 0; i < imgs.length; i++) {
                var src = imgs[i].src || imgs[i].dataset.src;
                if (!src || src.includes('avatar') || src.includes('100x100')) continue;
                try {
                  var r = await fetch(src);
                  var b = await r.blob();
                  var ext = b.type.includes('webp') ? '.webp' : b.type.includes('png') ? '.png' : '.jpg';
                  var a2 = document.createElement('a');
                  a2.href = URL.createObjectURL(b);
                  a2.download = filename + '_' + (count + 1) + ext;
                  document.body.appendChild(a2);
                  a2.click();
                  document.body.removeChild(a2);
                  URL.revokeObjectURL(a2.href);
                  count++;
                } catch(e) {}
              }
              return count > 0 ? count + '_images_downloading' : 'no_media_found';
            })()
      - wait: 5000
      - return:
          - field: 类型
            value: "{{media_type}}"
          - field: 作者
            value: "{{author}}"
          - field: 描述
            value: "{{desc}}"
          - field: 作品ID
            value: "{{aweme_id}}"
          - field: 下载状态
            value: "{{dl_result}}"

  post:
    args: [video, title, desc, cover]   # video: 本地视频路径（必填）, cover: 封面图片路径（可选）
    steps:
      - open: "https://creator.douyin.com/creator-micro/content/upload"
      - wait: 4000
      # 上传视频
      - upload:
          selector: "input[type=file]"
          file: "{{video}}"
      # 等待编辑器渲染（标题输入框出现）
      - wait:
          selector: "input[placeholder='填写作品标题，为作品获得更多流量']"
      - wait: 1000
      # 等待视频上传完成（进度条消失 或 上传成功文字出现）
      # 抖音上传中会显示进度百分比，上传完成后进度区域消失或显示"上传完成"
      - wait_until:
          eval: >-
            (function(){
              var body = document.body.innerText;
              if (body.includes('上传完成') || body.includes('Upload complete')) return true;
              var progress = document.querySelector('.progress-bar, .upload-progress, [class*=progress]');
              if (!progress) return true;
              var text = progress.textContent || '';
              if (text.includes('100%')) return true;
              var btn = [...document.querySelectorAll('button')].find(function(b){ return b.textContent.trim() === '发布' && !b.disabled; });
              return !!btn;
            })()
          timeout: 300000
          interval: 3000
      # 填写标题
      - fill:
          selector: "input[placeholder='填写作品标题，为作品获得更多流量']"
          value: "{{title}}"
      - wait: 500
      # 填写描述（contenteditable）
      - type_rich:
          selector: ".zone-container.editor-kit-container"
          value: "{{desc}}"
      - wait: 800
      # 封面上传（可选，cover 为空时自动跳过）
      - eval: >-
          (function(){
            var cover = "{{cover}}";
            if (!cover || cover.indexOf("{{") === 0) return "no_cover";
            var btn = document.querySelector('.cover-Jg3T4p') ||
                      document.querySelector('[class*=cover-select], [class*=cover-edit]');
            if (btn) btn.click();
            return btn ? "opened" : "no_btn";
          })()
      - wait: 2000
      - eval: >-
          (function(){
            var tab = [...document.querySelectorAll('span,div,button,li')]
              .find(function(el){ var t = el.textContent.trim(); return t === '上传封面' || t === '本地上传'; });
            if (tab) tab.click();
            return !!tab;
          })()
      - wait: 1000
      - upload:
          selector: ".semi-upload-hidden-input, input[type=file][accept*=image]"
          file: "{{cover}}"
      - wait: 3000
      - eval: >-
          (function(){
            var btn = [...document.querySelectorAll('button')]
              .find(function(b){ return b.textContent.trim() === '完成'; });
            if (btn) btn.click();
            return !!btn;
          })()
      - wait: 1000
      - eval: >-
          (function(){
            var btn = [...document.querySelectorAll('button')]
              .find(function(b){ return b.textContent.trim() === '暂不设置'; });
            if (btn) btn.click();
            return !!btn;
          })()
      - wait: 500
      # 点击发布
      - eval: >-
          (function(){
            var btn = [...document.querySelectorAll('button')].find(function(b){
              return b.textContent.trim() === '发布' && !b.disabled;
            });
            if (btn) { btn.click(); return true; }
            return false;
          })()
      - wait: 5000
      - capture:
          name: result_url
          eval: "location.href"
      - capture:
          name: success
          eval: "document.body.innerText.includes('发布成功') || document.body.innerText.includes('作品发布') || location.href.includes('/content/manage') || location.href !== 'https://creator.douyin.com/creator-micro/content/upload'"
      - return:
          - field: 状态
            value: "{{success === 'true' ? '✅ 发布成功' : '⚠️ 请检查页面'}}"
          - field: 标题
            value: "{{title}}"
          - field: 描述
            value: "{{desc}}"
          - field: 跳转URL
            value: "{{result_url}}"
