platform: linkedin
login_url: https://www.linkedin.com
login_check:
  cookie: li_at

# LinkedIn 发帖使用 Share Modal（从 feed 页触发）。
# 文本编辑器为 Quill（.ql-editor）或 contenteditable div。
# LinkedIn 无独立标题字段，title 与 desc 合并写入正文。

commands:

  # ── 发布视频 ──────────────────────────────────────────────────────────────────
  post_video:
    args: [video, title, desc]   # video: 本地视频路径（必填）
    steps:
      - open: "https://www.linkedin.com/feed/"
      - wait: 3000
      # 点击 "Start a post" / "发起帖子" 打开 Share Modal（4 层降级）
      - eval: >-
          (function(){
            var trigger = document.querySelector('.share-box-feed-entry__trigger') ||
                          document.querySelector('[class*="share-box"][class*="trigger"]') ||
                          document.querySelector('[class*="share-creation"][class*="trigger"]');
            if (trigger) { trigger.click(); return "opened_t1"; }
            trigger = document.querySelector('button[aria-label*="Start a post"]') ||
                      document.querySelector('button[aria-label*="Create a post"]') ||
                      document.querySelector('[role="button"][aria-label*="Start a post"]');
            if (trigger) { trigger.click(); return "opened_t2"; }
            var els = document.querySelectorAll('button, div[role="button"], div[tabindex="0"], span[role="button"]');
            for (var i = 0; i < els.length; i++) {
              var t = els[i].textContent.trim();
              if (t.length < 30 && (/Start a post|Create a post|发起帖子|开始发帖/.test(t))) {
                els[i].click();
                return "opened_t3";
              }
            }
            var ph = document.querySelector('[placeholder*="Start a post"], [placeholder*="发起帖子"]') ||
                     document.querySelector('[class*="share-box"] [contenteditable]');
            if (ph) { ph.click(); return "opened_t4"; }
            return "no_trigger";
          })()
      - wait: 2000
      # 等待 Share Modal 渲染完成
      - wait_until:
          eval: >-
            (function(){
              return !!(
                document.querySelector('.ql-editor[contenteditable="true"]') ||
                document.querySelector('[role="textbox"][contenteditable="true"]') ||
                document.querySelector('.editor-content [contenteditable="true"]') ||
                document.querySelector('[class*="share"] [contenteditable="true"]') ||
                document.querySelector('[class*="share-creation"] [contenteditable="true"]') ||
                document.querySelector('[aria-label*="Text editor"]') ||
                document.querySelector('div[contenteditable="true"][role="textbox"]')
              );
            })()
          timeout: 10000
          interval: 500
      # 点击媒体/视频上传按钮（底部工具栏）
      - eval: >-
          (function(){
            var selectors = [
              'button[aria-label*="Add a photo"]',
              'button[aria-label*="Add media"]',
              'button[aria-label*="Add a video"]',
              'button[aria-label*="添加媒体"]',
              'button[aria-label*="添加照片"]',
              'button[aria-label*="添加视频"]',
              'button[aria-label*="Photo"]',
              'button[aria-label*="Video"]',
              'button[aria-label*="视频"]',
              'button[aria-label*="Media"]',
              '.share-promoted-detour-button--media'
            ];
            for (var s = 0; s < selectors.length; s++) {
              var btn = document.querySelector(selectors[s]);
              if (btn) { btn.click(); return "opened_media_t1:" + selectors[s]; }
            }
            var modalBtns = document.querySelectorAll(
              '[class*="share-box"] button, [class*="share-creation"] button, ' +
              '[class*="share-promoted"] button, [role="dialog"] button'
            );
            for (var i = 0; i < modalBtns.length; i++) {
              var b = modalBtns[i];
              var label = ((b.getAttribute('aria-label') || '') + ' ' + b.textContent).toLowerCase();
              if (/photo|video|media|image|图片|视频|媒体|照片/.test(label)) {
                b.click();
                return "opened_media_t2";
              }
            }
            return "no_media_btn";
          })()
      - wait: 1000
      # 等待文件选择器出现（关键步骤，防止 upload 空跑）
      - wait_until:
          eval: "!!document.querySelector('input[type=\"file\"]')"
          timeout: 10000
          interval: 500
      # 上传视频
      - upload:
          selector: "input[type=file][accept*=video], input[type=file][accept*='*'], input[type=file][accept*='.mp4'], input[type=file]"
          file: "{{video}}"
      # 等待视频上传+处理完成（进度条消失 / Post 按钮可用）
      - wait_until:
          eval: >-
            (function(){
              var body = document.body.innerText;
              if (body.includes('Upload complete') || body.includes('上传完成') ||
                  body.includes('Ready to post') || body.includes('处理完成')) return true;
              var progress = document.querySelector('[role=progressbar], [class*=progress-bar], [class*=uploading], [class*=upload-progress]');
              if (progress && progress.offsetParent !== null) return false;
              var postBtn = document.querySelector('.share-actions__primary-action:not([disabled])') ||
                            document.querySelector('[class*="share-actions"] button:not([disabled])') ||
                            document.querySelector('button[aria-label="Post"]:not([disabled])') ||
                            document.querySelector('button[aria-label="发布"]:not([disabled])');
              if (postBtn) return true;
              var btns = document.querySelectorAll('[role="dialog"] button, [class*="share"] button');
              for (var i = 0; i < btns.length; i++) {
                var t = btns[i].textContent.trim();
                if ((t === 'Post' || t === '发布' || t === 'Next') && !btns[i].disabled &&
                    !btns[i].classList.contains('disabled')) return true;
              }
              return false;
            })()
          timeout: 600000
          interval: 5000
      - wait: 1500
      # 填写正文（title + desc 合并，LinkedIn 无独立标题）
      - eval: >-
          (function(){
            var editor = document.querySelector('.ql-editor[contenteditable="true"]') ||
                         document.querySelector('[role="textbox"][contenteditable="true"]') ||
                         document.querySelector('.editor-content [contenteditable="true"]') ||
                         document.querySelector('[class*="share"] [contenteditable="true"]') ||
                         document.querySelector('[class*="share-creation"] [contenteditable="true"]') ||
                         document.querySelector('[aria-label*="Text editor"]') ||
                         document.querySelector('div[contenteditable="true"][role="textbox"]');
            if (!editor) return "no_editor";
            editor.focus();
            document.execCommand("selectAll", false, null);
            document.execCommand("delete", false, null);
            var title = "{{title}}";
            var desc = "{{desc}}";
            var text = title;
            if (desc && desc.indexOf("{{") !== 0) {
              text = text + "\n\n" + desc;
            }
            document.execCommand("insertText", false, text);
            return "ok";
          })()
      - wait: 500
      # 点击 Post / 发布
      - eval: >-
          (function(){
            var btn = document.querySelector('.share-actions__primary-action:not([disabled])') ||
                      document.querySelector('[class*="share-actions"] button[class*="primary"]:not([disabled])') ||
                      document.querySelector('button[aria-label="Post"]:not([disabled])') ||
                      document.querySelector('button[aria-label="发布"]:not([disabled])');
            if (btn) { btn.click(); return true; }
            var btns = document.querySelectorAll('[role="dialog"] button, [class*="share"] button');
            for (var i = 0; i < btns.length; i++) {
              var t = btns[i].textContent.trim();
              if ((t === 'Post' || t === '发布') && !btns[i].disabled) {
                btns[i].click();
                return true;
              }
            }
            return false;
          })()
      - wait: 5000
      - capture:
          name: result_url
          eval: "location.href"
      - capture:
          name: success
          eval: >-
            (function(){
              var body = document.body.innerText;
              if (body.includes('Post successful') || body.includes('发布成功') ||
                  body.includes('Your post is being processed') ||
                  body.includes('帖子正在处理中') ||
                  body.includes('Your post has been shared')) return true;
              var modal = document.querySelector('.share-box--modal') ||
                          document.querySelector('[class*="share-creation-state"]') ||
                          document.querySelector('[role="dialog"][class*="share"]');
              return !modal;
            })()
      - return:
          - field: 状态
            value: "{{success === 'true' ? '✅ LinkedIn 视频发布成功' : '⚠️ 请检查页面'}}"
          - field: 标题
            value: "{{title}}"
          - field: 描述
            value: "{{desc}}"
          - field: 页面URL
            value: "{{result_url}}"

  # ── 纯文本帖子 ────────────────────────────────────────────────────────────────
  post:
    args: [text]
    steps:
      - open: "https://www.linkedin.com/feed/"
      - wait: 3000
      - eval: >-
          (function(){
            var trigger = document.querySelector('.share-box-feed-entry__trigger') ||
                          document.querySelector('[class*="share-box"][class*="trigger"]') ||
                          document.querySelector('[class*="share-creation"][class*="trigger"]');
            if (trigger) { trigger.click(); return "opened_t1"; }
            trigger = document.querySelector('button[aria-label*="Start a post"]') ||
                      document.querySelector('button[aria-label*="Create a post"]') ||
                      document.querySelector('[role="button"][aria-label*="Start a post"]');
            if (trigger) { trigger.click(); return "opened_t2"; }
            var els = document.querySelectorAll('button, div[role="button"], div[tabindex="0"], span[role="button"]');
            for (var i = 0; i < els.length; i++) {
              var t = els[i].textContent.trim();
              if (t.length < 30 && (/Start a post|Create a post|发起帖子|开始发帖/.test(t))) {
                els[i].click();
                return "opened_t3";
              }
            }
            return "no_trigger";
          })()
      - wait: 2000
      - wait_until:
          eval: >-
            (function(){
              return !!(
                document.querySelector('.ql-editor[contenteditable="true"]') ||
                document.querySelector('[role="textbox"][contenteditable="true"]') ||
                document.querySelector('[class*="share"] [contenteditable="true"]') ||
                document.querySelector('[aria-label*="Text editor"]') ||
                document.querySelector('div[contenteditable="true"][role="textbox"]')
              );
            })()
          timeout: 10000
          interval: 500
      - eval: >-
          (function(){
            var editor = document.querySelector('.ql-editor[contenteditable="true"]') ||
                         document.querySelector('[role="textbox"][contenteditable="true"]') ||
                         document.querySelector('[class*="share"] [contenteditable="true"]') ||
                         document.querySelector('[aria-label*="Text editor"]') ||
                         document.querySelector('div[contenteditable="true"][role="textbox"]');
            if (!editor) return "no_editor";
            editor.focus();
            document.execCommand("insertText", false, "{{text}}");
            return "ok";
          })()
      - wait: 500
      - eval: >-
          (function(){
            var btn = document.querySelector('.share-actions__primary-action:not([disabled])') ||
                      document.querySelector('[class*="share-actions"] button[class*="primary"]:not([disabled])') ||
                      document.querySelector('button[aria-label="Post"]:not([disabled])') ||
                      document.querySelector('button[aria-label="发布"]:not([disabled])');
            if (btn) { btn.click(); return true; }
            var btns = document.querySelectorAll('[role="dialog"] button, [class*="share"] button');
            for (var i = 0; i < btns.length; i++) {
              var t = btns[i].textContent.trim();
              if ((t === 'Post' || t === '发布') && !btns[i].disabled) {
                btns[i].click();
                return true;
              }
            }
            return false;
          })()
      - wait: 3000
      - capture:
          name: result_url
          eval: "location.href"
      - return:
          - field: 状态
            value: "✅ LinkedIn 帖子发布成功"
          - field: 内容
            value: "{{text}}"
          - field: 页面URL
            value: "{{result_url}}"

  # ── 点赞帖子 ──────────────────────────────────────────────────────────────────
  like:
    args: [url]
    steps:
      - open: "{{url}}"
      - wait: 3000
      - capture:
          name: before
          eval: >-
            (function(){
              var btn = document.querySelector('button[aria-label*="Like"]') ||
                        document.querySelector('button[aria-label*="赞"]') ||
                        document.querySelector('[data-control-name*="like"]');
              if (!btn) return "no_btn";
              return btn.getAttribute('aria-pressed') === 'true' ? 'liked' : 'not_liked';
            })()
      - eval: >-
          (function(){
            var btn = document.querySelector('button[aria-label*="Like"]') ||
                      document.querySelector('button[aria-label*="赞"]') ||
                      document.querySelector('[data-control-name*="like"]') ||
                      [...document.querySelectorAll('.social-actions-button, .react-button, button')]
                        .find(function(b){
                          var label = (b.getAttribute('aria-label') || '') + ' ' + b.textContent;
                          return /\blike\b|^赞$|点赞/i.test(label.trim());
                        });
            if (btn) { btn.click(); return true; }
            return false;
          })()
      - wait: 1500
      - capture:
          name: after
          eval: >-
            (function(){
              var btn = document.querySelector('button[aria-label*="Like"]') ||
                        document.querySelector('button[aria-label*="赞"]');
              if (!btn) return "unknown";
              return btn.getAttribute('aria-pressed') === 'true' ? 'liked' : 'not_liked';
            })()
      - return:
          - field: 操作
            value: "{{before === 'liked' ? '取消点赞' : '点赞成功'}}"
          - field: 当前状态
            value: "{{after === 'liked' ? '✅ 已点赞' : '❌ 未点赞'}}"

  # ── 发表评论 ──────────────────────────────────────────────────────────────────
  comment:
    args: [url, text]
    steps:
      - open: "{{url}}"
      - wait: 3000
      # 点击评论输入框区域展开
      - eval: >-
          (function(){
            var commentBtn = document.querySelector('button[aria-label*="Comment"]') ||
                             document.querySelector('button[aria-label*="评论"]') ||
                             [...document.querySelectorAll('.social-actions-button, button')]
                               .find(function(b){
                                 var label = (b.getAttribute('aria-label') || '') + ' ' + b.textContent;
                                 return /comment|评论/i.test(label);
                               });
            if (commentBtn) { commentBtn.click(); return "opened"; }
            return "no_comment_btn";
          })()
      - wait: 1500
      # 等待评论编辑器出现
      - wait_until:
          eval: >-
            (function(){
              return !!(document.querySelector('.ql-editor[data-placeholder*="Add a comment"]') ||
                        document.querySelector('.ql-editor[data-placeholder*="添加评论"]') ||
                        document.querySelector('.comments-comment-box .ql-editor') ||
                        document.querySelector('[class*=comment] .ql-editor') ||
                        document.querySelector('[class*=comment] [contenteditable=true]'));
            })()
          timeout: 10000
          interval: 500
      # 输入评论
      - eval: >-
          (function(){
            var editor = document.querySelector('.comments-comment-box .ql-editor') ||
                         document.querySelector('[class*=comment] .ql-editor') ||
                         document.querySelector('.ql-editor[data-placeholder*="Add a comment"]') ||
                         document.querySelector('.ql-editor[data-placeholder*="添加评论"]') ||
                         document.querySelector('[class*=comment] [contenteditable=true]');
            if (!editor) return "no_editor";
            editor.focus();
            document.execCommand("insertText", false, "{{text}}");
            return "ok";
          })()
      - wait: 500
      # 点击提交评论
      - eval: >-
          (function(){
            var btn = document.querySelector('.comments-comment-box__submit-button:not([disabled])') ||
                      document.querySelector('[class*=comment] button[class*=submit]:not([disabled])') ||
                      [...document.querySelectorAll('[class*=comment] button')]
                        .find(function(b){
                          var t = b.textContent.trim();
                          return (t === 'Post' || t === '发布' || t === 'Comment' || t === '评论') && !b.disabled;
                        });
            if (btn) { btn.click(); return true; }
            return false;
          })()
      - wait: 2000
      - return:
          - field: 状态
            value: "✅ LinkedIn 评论成功"
          - field: 评论内容
            value: "{{text}}"

  # ── 发布图片帖子 ────────────────────────────────────────────────────────────
  post_media:
    args: [text, media]   # media: 本地图片/视频路径
    steps:
      - open: "https://www.linkedin.com/feed/"
      - wait: 3000
      - eval: >-
          (function(){
            var trigger = document.querySelector('.share-box-feed-entry__trigger') ||
                          document.querySelector('[class*="share-box"][class*="trigger"]') ||
                          document.querySelector('[class*="share-creation"][class*="trigger"]');
            if (trigger) { trigger.click(); return "opened_t1"; }
            trigger = document.querySelector('button[aria-label*="Start a post"]') ||
                      document.querySelector('button[aria-label*="Create a post"]') ||
                      document.querySelector('[role="button"][aria-label*="Start a post"]');
            if (trigger) { trigger.click(); return "opened_t2"; }
            var els = document.querySelectorAll('button, div[role="button"], div[tabindex="0"], span[role="button"]');
            for (var i = 0; i < els.length; i++) {
              var t = els[i].textContent.trim();
              if (t.length < 30 && (/Start a post|Create a post|发起帖子|开始发帖/.test(t))) {
                els[i].click();
                return "opened_t3";
              }
            }
            return "no_trigger";
          })()
      - wait: 2000
      - wait_until:
          eval: >-
            (function(){
              return !!(
                document.querySelector('.ql-editor[contenteditable="true"]') ||
                document.querySelector('[role="textbox"][contenteditable="true"]') ||
                document.querySelector('[class*="share"] [contenteditable="true"]') ||
                document.querySelector('[aria-label*="Text editor"]') ||
                document.querySelector('div[contenteditable="true"][role="textbox"]')
              );
            })()
          timeout: 10000
          interval: 500
      # 点击媒体上传按钮
      - eval: >-
          (function(){
            var selectors = [
              'button[aria-label*="Add a photo"]',
              'button[aria-label*="Add media"]',
              'button[aria-label*="添加照片"]',
              'button[aria-label*="添加媒体"]',
              'button[aria-label*="Photo"]',
              'button[aria-label*="Media"]',
              '.share-promoted-detour-button--media'
            ];
            for (var s = 0; s < selectors.length; s++) {
              var btn = document.querySelector(selectors[s]);
              if (btn) { btn.click(); return "opened_media_t1"; }
            }
            var modalBtns = document.querySelectorAll(
              '[class*="share-box"] button, [class*="share-creation"] button, [role="dialog"] button'
            );
            for (var i = 0; i < modalBtns.length; i++) {
              var b = modalBtns[i];
              var label = ((b.getAttribute('aria-label') || '') + ' ' + b.textContent).toLowerCase();
              if (/photo|media|image|图片|媒体|照片/.test(label)) {
                b.click();
                return "opened_media_t2";
              }
            }
            return "no_media_btn";
          })()
      - wait: 1000
      # 等待文件选择器出现
      - wait_until:
          eval: "!!document.querySelector('input[type=\"file\"]')"
          timeout: 10000
          interval: 500
      - upload:
          selector: "input[type=file]"
          file: "{{media}}"
      - wait_until:
          eval: >-
            (function(){
              var progress = document.querySelector('[role=progressbar]');
              if (progress && progress.offsetParent !== null) return false;
              var btn = document.querySelector('.share-actions__primary-action:not([disabled])') ||
                        document.querySelector('[class*="share-actions"] button:not([disabled])') ||
                        document.querySelector('button[aria-label="Post"]:not([disabled])');
              if (btn) return true;
              var btns = document.querySelectorAll('[role="dialog"] button, [class*="share"] button');
              for (var i = 0; i < btns.length; i++) {
                var t = btns[i].textContent.trim();
                if ((t === 'Post' || t === '发布' || t === 'Next' || t === '下一步') && !btns[i].disabled) return true;
              }
              return false;
            })()
          timeout: 300000
          interval: 3000
      - wait: 1000
      - eval: >-
          (function(){
            var editor = document.querySelector('.ql-editor[contenteditable="true"]') ||
                         document.querySelector('[role="textbox"][contenteditable="true"]') ||
                         document.querySelector('[class*="share"] [contenteditable="true"]') ||
                         document.querySelector('[aria-label*="Text editor"]') ||
                         document.querySelector('div[contenteditable="true"][role="textbox"]');
            if (!editor) return "no_editor";
            editor.focus();
            document.execCommand("insertText", false, "{{text}}");
            return "ok";
          })()
      - wait: 500
      - eval: >-
          (function(){
            var btn = document.querySelector('.share-actions__primary-action:not([disabled])') ||
                      document.querySelector('[class*="share-actions"] button[class*="primary"]:not([disabled])') ||
                      document.querySelector('button[aria-label="Post"]:not([disabled])') ||
                      document.querySelector('button[aria-label="发布"]:not([disabled])');
            if (btn) { btn.click(); return true; }
            var btns = document.querySelectorAll('[role="dialog"] button, [class*="share"] button');
            for (var i = 0; i < btns.length; i++) {
              var t = btns[i].textContent.trim();
              if ((t === 'Post' || t === '发布') && !btns[i].disabled) {
                btns[i].click();
                return true;
              }
            }
            return false;
          })()
      - wait: 3000
      - capture:
          name: result_url
          eval: "location.href"
      - return:
          - field: 状态
            value: "✅ LinkedIn 媒体帖子发布成功"
          - field: 内容
            value: "{{text}}"
          - field: 页面URL
            value: "{{result_url}}"
