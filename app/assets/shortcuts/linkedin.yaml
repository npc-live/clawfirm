platform: linkedin
login_url: https://www.linkedin.com
login_check:
  cookie: li_at

# LinkedIn 发帖使用 Share Modal（从 feed 页触发）。
# 文本编辑器为 Quill（.ql-editor）或 contenteditable div。
# LinkedIn 无独立标题字段，title 与 desc 合并写入正文。

commands:

  # ── 发布视频 ──────────────────────────────────────────────────────────────────
  post_video:
    args: [video, title, desc]   # video: 本地视频路径（必填）
    steps:
      - open: "https://www.linkedin.com/feed/"
      - wait: 3000
      # 点击 "Start a post" / "发起帖子" 打开 Share Modal
      - eval: >-
          (function(){
            var trigger = document.querySelector('.share-box-feed-entry__trigger') ||
                          document.querySelector('[class*=share-box-feed-entry__trigger]') ||
                          [...document.querySelectorAll('button,div[role=button],div[tabindex="0"]')]
                            .find(function(el){
                              var t = el.textContent.trim();
                              return t.includes('Start a post') || t.includes('发起帖子') ||
                                     t.includes('开始发帖') || t.includes('Create a post');
                            });
            if (trigger) { trigger.click(); return "opened"; }
            return "no_trigger";
          })()
      - wait: 2000
      # 等待 Share Modal 渲染完成
      - wait_until:
          eval: >-
            (function(){
              var editor = document.querySelector('.ql-editor[contenteditable=true]') ||
                           document.querySelector('[role=textbox][contenteditable=true]') ||
                           document.querySelector('.editor-content [contenteditable=true]');
              return !!editor;
            })()
          timeout: 10000
          interval: 500
      # 点击媒体/视频上传按钮（底部工具栏）
      - eval: >-
          (function(){
            var mediaBtn =
              document.querySelector('button[aria-label*="Add a photo"]') ||
              document.querySelector('button[aria-label*="Add media"]') ||
              document.querySelector('button[aria-label*="添加媒体"]') ||
              document.querySelector('button[aria-label*="添加照片"]') ||
              document.querySelector('button[aria-label*="Photo"]') ||
              document.querySelector('button[aria-label*="Video"]') ||
              document.querySelector('button[aria-label*="视频"]') ||
              document.querySelector('.share-promoted-detour-button--media') ||
              document.querySelector('[class*=share-creation-state] button[class*=media]') ||
              [...document.querySelectorAll('.share-box--modal button, [class*=share-creation] button')]
                .find(function(b){
                  var label = (b.getAttribute('aria-label') || '') + ' ' + b.textContent;
                  return /photo|video|media|图片|视频|媒体/i.test(label);
                });
            if (mediaBtn) { mediaBtn.click(); return "opened_media"; }
            return "no_media_btn";
          })()
      - wait: 1500
      # 上传视频
      - upload:
          selector: "input[type=file][accept*=video], input[type=file][accept*='*'], input[type=file][accept*='.mp4'], input[type=file]"
          file: "{{video}}"
      # 等待视频上传+处理完成（进度条消失 / Post 按钮可用）
      - wait_until:
          eval: >-
            (function(){
              var body = document.body.innerText;
              if (body.includes('Upload complete') || body.includes('上传完成') || body.includes('Ready to post')) return true;
              var progress = document.querySelector('[role=progressbar], [class*=progress-bar], [class*=uploading]');
              if (progress && progress.offsetParent !== null) return false;
              var postBtn = document.querySelector('.share-actions__primary-action:not([disabled])') ||
                            [...document.querySelectorAll('button[class*=share-actions] , button')]
                              .find(function(b){
                                var t = b.textContent.trim();
                                return (t === 'Post' || t === '发布' || t === 'Next') && !b.disabled && !b.classList.contains('disabled');
                              });
              return !!postBtn;
            })()
          timeout: 600000
          interval: 5000
      - wait: 1500
      # 填写正文（title + desc 合并，LinkedIn 无独立标题）
      - eval: >-
          (function(){
            var editor = document.querySelector('.ql-editor[contenteditable=true]') ||
                         document.querySelector('[role=textbox][contenteditable=true]') ||
                         document.querySelector('.editor-content [contenteditable=true]');
            if (!editor) return "no_editor";
            editor.focus();
            document.execCommand("selectAll", false, null);
            document.execCommand("delete", false, null);
            var title = "{{title}}";
            var desc = "{{desc}}";
            var text = title;
            if (desc && desc.indexOf("{{") !== 0) {
              text = text + "\n\n" + desc;
            }
            document.execCommand("insertText", false, text);
            return "ok";
          })()
      - wait: 500
      # 点击 Post / 发布
      - eval: >-
          (function(){
            var btn = document.querySelector('.share-actions__primary-action:not([disabled])') ||
                      [...document.querySelectorAll('button')]
                        .find(function(b){
                          var t = b.textContent.trim();
                          return (t === 'Post' || t === '发布') && !b.disabled;
                        });
            if (btn) { btn.click(); return true; }
            return false;
          })()
      - wait: 5000
      - capture:
          name: result_url
          eval: "location.href"
      - capture:
          name: success
          eval: >-
            (function(){
              var body = document.body.innerText;
              return body.includes('Post successful') || body.includes('发布成功') ||
                     body.includes('Your post is being processed') ||
                     !document.querySelector('.share-box--modal');
            })()
      - return:
          - field: 状态
            value: "{{success === 'true' ? '✅ LinkedIn 视频发布成功' : '⚠️ 请检查页面'}}"
          - field: 标题
            value: "{{title}}"
          - field: 描述
            value: "{{desc}}"
          - field: 页面URL
            value: "{{result_url}}"

  # ── 纯文本帖子 ────────────────────────────────────────────────────────────────
  post:
    args: [text]
    steps:
      - open: "https://www.linkedin.com/feed/"
      - wait: 3000
      - eval: >-
          (function(){
            var trigger = document.querySelector('.share-box-feed-entry__trigger') ||
                          [...document.querySelectorAll('button,div[role=button],div[tabindex="0"]')]
                            .find(function(el){
                              var t = el.textContent.trim();
                              return t.includes('Start a post') || t.includes('发起帖子');
                            });
            if (trigger) { trigger.click(); return "opened"; }
            return "no_trigger";
          })()
      - wait: 2000
      - wait_until:
          eval: >-
            (function(){
              return !!(document.querySelector('.ql-editor[contenteditable=true]') ||
                        document.querySelector('[role=textbox][contenteditable=true]'));
            })()
          timeout: 10000
          interval: 500
      - eval: >-
          (function(){
            var editor = document.querySelector('.ql-editor[contenteditable=true]') ||
                         document.querySelector('[role=textbox][contenteditable=true]');
            if (!editor) return "no_editor";
            editor.focus();
            document.execCommand("insertText", false, "{{text}}");
            return "ok";
          })()
      - wait: 500
      - eval: >-
          (function(){
            var btn = document.querySelector('.share-actions__primary-action:not([disabled])') ||
                      [...document.querySelectorAll('button')]
                        .find(function(b){
                          var t = b.textContent.trim();
                          return (t === 'Post' || t === '发布') && !b.disabled;
                        });
            if (btn) { btn.click(); return true; }
            return false;
          })()
      - wait: 3000
      - capture:
          name: result_url
          eval: "location.href"
      - return:
          - field: 状态
            value: "✅ LinkedIn 帖子发布成功"
          - field: 内容
            value: "{{text}}"
          - field: 页面URL
            value: "{{result_url}}"

  # ── 点赞帖子 ──────────────────────────────────────────────────────────────────
  like:
    args: [url]
    steps:
      - open: "{{url}}"
      - wait: 3000
      - capture:
          name: before
          eval: >-
            (function(){
              var btn = document.querySelector('button[aria-label*="Like"]') ||
                        document.querySelector('button[aria-label*="赞"]') ||
                        document.querySelector('[data-control-name*="like"]');
              if (!btn) return "no_btn";
              return btn.getAttribute('aria-pressed') === 'true' ? 'liked' : 'not_liked';
            })()
      - eval: >-
          (function(){
            var btn = document.querySelector('button[aria-label*="Like"]') ||
                      document.querySelector('button[aria-label*="赞"]') ||
                      document.querySelector('[data-control-name*="like"]') ||
                      [...document.querySelectorAll('.social-actions-button, .react-button, button')]
                        .find(function(b){
                          var label = (b.getAttribute('aria-label') || '') + ' ' + b.textContent;
                          return /\blike\b|^赞$|点赞/i.test(label.trim());
                        });
            if (btn) { btn.click(); return true; }
            return false;
          })()
      - wait: 1500
      - capture:
          name: after
          eval: >-
            (function(){
              var btn = document.querySelector('button[aria-label*="Like"]') ||
                        document.querySelector('button[aria-label*="赞"]');
              if (!btn) return "unknown";
              return btn.getAttribute('aria-pressed') === 'true' ? 'liked' : 'not_liked';
            })()
      - return:
          - field: 操作
            value: "{{before === 'liked' ? '取消点赞' : '点赞成功'}}"
          - field: 当前状态
            value: "{{after === 'liked' ? '✅ 已点赞' : '❌ 未点赞'}}"

  # ── 发表评论 ──────────────────────────────────────────────────────────────────
  comment:
    args: [url, text]
    steps:
      - open: "{{url}}"
      - wait: 3000
      # 点击评论输入框区域展开
      - eval: >-
          (function(){
            var commentBtn = document.querySelector('button[aria-label*="Comment"]') ||
                             document.querySelector('button[aria-label*="评论"]') ||
                             [...document.querySelectorAll('.social-actions-button, button')]
                               .find(function(b){
                                 var label = (b.getAttribute('aria-label') || '') + ' ' + b.textContent;
                                 return /comment|评论/i.test(label);
                               });
            if (commentBtn) { commentBtn.click(); return "opened"; }
            return "no_comment_btn";
          })()
      - wait: 1500
      # 等待评论编辑器出现
      - wait_until:
          eval: >-
            (function(){
              return !!(document.querySelector('.ql-editor[data-placeholder*="Add a comment"]') ||
                        document.querySelector('.ql-editor[data-placeholder*="添加评论"]') ||
                        document.querySelector('.comments-comment-box .ql-editor') ||
                        document.querySelector('[class*=comment] .ql-editor') ||
                        document.querySelector('[class*=comment] [contenteditable=true]'));
            })()
          timeout: 10000
          interval: 500
      # 输入评论
      - eval: >-
          (function(){
            var editor = document.querySelector('.comments-comment-box .ql-editor') ||
                         document.querySelector('[class*=comment] .ql-editor') ||
                         document.querySelector('.ql-editor[data-placeholder*="Add a comment"]') ||
                         document.querySelector('.ql-editor[data-placeholder*="添加评论"]') ||
                         document.querySelector('[class*=comment] [contenteditable=true]');
            if (!editor) return "no_editor";
            editor.focus();
            document.execCommand("insertText", false, "{{text}}");
            return "ok";
          })()
      - wait: 500
      # 点击提交评论
      - eval: >-
          (function(){
            var btn = document.querySelector('.comments-comment-box__submit-button:not([disabled])') ||
                      document.querySelector('[class*=comment] button[class*=submit]:not([disabled])') ||
                      [...document.querySelectorAll('[class*=comment] button')]
                        .find(function(b){
                          var t = b.textContent.trim();
                          return (t === 'Post' || t === '发布' || t === 'Comment' || t === '评论') && !b.disabled;
                        });
            if (btn) { btn.click(); return true; }
            return false;
          })()
      - wait: 2000
      - return:
          - field: 状态
            value: "✅ LinkedIn 评论成功"
          - field: 评论内容
            value: "{{text}}"

  # ── 发布图片帖子 ────────────────────────────────────────────────────────────
  post_media:
    args: [text, media]   # media: 本地图片/视频路径
    steps:
      - open: "https://www.linkedin.com/feed/"
      - wait: 3000
      - eval: >-
          (function(){
            var trigger = document.querySelector('.share-box-feed-entry__trigger') ||
                          [...document.querySelectorAll('button,div[role=button],div[tabindex="0"]')]
                            .find(function(el){
                              var t = el.textContent.trim();
                              return t.includes('Start a post') || t.includes('发起帖子');
                            });
            if (trigger) { trigger.click(); return "opened"; }
            return "no_trigger";
          })()
      - wait: 2000
      - wait_until:
          eval: >-
            (function(){
              return !!(document.querySelector('.ql-editor[contenteditable=true]') ||
                        document.querySelector('[role=textbox][contenteditable=true]'));
            })()
          timeout: 10000
          interval: 500
      # 点击媒体上传按钮
      - eval: >-
          (function(){
            var mediaBtn =
              document.querySelector('button[aria-label*="Add a photo"]') ||
              document.querySelector('button[aria-label*="Photo"]') ||
              document.querySelector('button[aria-label*="添加照片"]') ||
              document.querySelector('button[aria-label*="媒体"]') ||
              document.querySelector('.share-promoted-detour-button--media') ||
              [...document.querySelectorAll('.share-box--modal button, [class*=share-creation] button')]
                .find(function(b){
                  var label = (b.getAttribute('aria-label') || '') + ' ' + b.textContent;
                  return /photo|media|图片|媒体/i.test(label);
                });
            if (mediaBtn) { mediaBtn.click(); return "opened_media"; }
            return "no_media_btn";
          })()
      - wait: 1500
      - upload:
          selector: "input[type=file]"
          file: "{{media}}"
      - wait_until:
          eval: >-
            (function(){
              var progress = document.querySelector('[role=progressbar]');
              if (progress && progress.offsetParent !== null) return false;
              var btn = document.querySelector('.share-actions__primary-action:not([disabled])') ||
                        [...document.querySelectorAll('button')]
                          .find(function(b){
                            var t = b.textContent.trim();
                            return (t === 'Post' || t === '发布' || t === 'Next' || t === '下一步') && !b.disabled;
                          });
              return !!btn;
            })()
          timeout: 300000
          interval: 3000
      - wait: 1000
      - eval: >-
          (function(){
            var editor = document.querySelector('.ql-editor[contenteditable=true]') ||
                         document.querySelector('[role=textbox][contenteditable=true]');
            if (!editor) return "no_editor";
            editor.focus();
            document.execCommand("insertText", false, "{{text}}");
            return "ok";
          })()
      - wait: 500
      - eval: >-
          (function(){
            var btn = document.querySelector('.share-actions__primary-action:not([disabled])') ||
                      [...document.querySelectorAll('button')]
                        .find(function(b){
                          var t = b.textContent.trim();
                          return (t === 'Post' || t === '发布') && !b.disabled;
                        });
            if (btn) { btn.click(); return true; }
            return false;
          })()
      - wait: 3000
      - capture:
          name: result_url
          eval: "location.href"
      - return:
          - field: 状态
            value: "✅ LinkedIn 媒体帖子发布成功"
          - field: 内容
            value: "{{text}}"
          - field: 页面URL
            value: "{{result_url}}"
